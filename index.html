        // Dalam implementasi nyata, ini HARUS di Cloud Functions. 
        // Namun untuk memenuhi single-file demo yang fungsional, kita buat sistem queue resilient di client.
        const useWAQueueWorker = (user) => {
            useEffect(() => {
                if (!user) return;
                
                let isRunning = false;
                
                const processQueue = async () => {
                    if (isRunning) return;
                    isRunning = true;

                    try {
                        // 1. Cek status pause
                        const configDoc = await getDoc(doc(db, 'settings', 'wa_queue'));
                        if (configDoc.exists()) {
                            const pausedUntil = configDoc.data().pausedUntil;
                            if (pausedUntil && pausedUntil > Date.now()) {
                                isRunning = false;
                                return; // Masih pause
                            }
                        }

                        // 2. Ambil 5 antrean
                        const q = query(collection(db, 'whatsappQueue'), where('status', '==', 'QUEUED'), orderBy('createdAt', 'asc'), limit(5));
                        const snapshot = await getDocs(q);
                        
                        if (snapshot.empty) {
                            isRunning = false;
                            return;
                        }

                        const batch = writeBatch(db);
                        let processedCount = 0;

                        // 3. Proses antrean
                        for (const docSnap of snapshot.docs) {
                            const data = docSnap.data();
                            
                            // SIMULASI API WHATSAPP (Ganti dengan fetch sungguhan)
                            console.log(`Mengirim WA ke ${data.parentPhone}: ${data.message.substring(0, 30)}...`);
                            
                            // Simulasi delay jaringan
                            await new Promise(res => setTimeout(res, 500));
                            
                            // Simulasi sukses 95%
                            const isSuccess = Math.random() > 0.05;

                            const docRef = doc(db, 'whatsappQueue', docSnap.id);
                            if (isSuccess) {
                                batch.update(docRef, { status: 'SENT', sentAt: serverTimestamp() });
                            } else {
                                const newAttempts = (data.attempts || 0) + 1;
                                if (newAttempts >= 3) {
                                    batch.update(docRef, { status: 'FAILED_FINAL', errorMessage: 'Gagal setelah 3 kali percobaan' });
                                } else {
                                    batch.update(docRef, { status: 'RETRY', attempts: newAttempts });
                                    // Set back to queued eventually by another cron job, or handle retry immediately
                                    setTimeout(() => {
                                        updateDoc(docRef, { status: 'QUEUED' });
                                    }, 60000); // retry after 1 min
                                }
                            }
                            processedCount++;
                        }

                        await batch.commit();

                        // 4. Jika memproses 5, pause 5 menit
                        if (processedCount >= 5) {
                            await setDoc(doc(db, 'settings', 'wa_queue'), {
                                pausedUntil: Date.now() + (5 * 60 * 1000) // 5 menit
                            }, { merge: true });
                        }

                    } catch (error) {
                        console.error("Queue Error:", error);
                    }

                    isRunning = false;
                };

                const interval = setInterval(processQueue, 5000); // Cek setiap 5 detik
                return () => clearInterval(interval);
            }, [user]);
        };

                        {/* Status WhatsApp */}

        const ScanView = ({ students, addAttendance }) => {
            const [scanResult, setScanResult] = useState(null);
            const [scanStatus, setScanStatus] = useState('ready'); // ready, success, error, duplicate
            const [currentTime, setCurrentTime] = useState(formatTime(getWITTime()));
            const inputRef = useRef(null);
            const [inputValue, setInputValue] = useState('');

            // Update jam realtime
            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(formatTime(getWITTime()));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // Fokus otomatis
            const maintainFocus = useCallback(() => {
                if (inputRef.current && scanStatus === 'ready') {
                    inputRef.current.focus();
                }
            }, [scanStatus]);

            useEffect(() => {
                maintainFocus();
                window.addEventListener('click', maintainFocus);
                return () => window.removeEventListener('click', maintainFocus);
            }, [maintainFocus]);

            const handleScanSubmit = async (e) => {
                e.preventDefault();
                const nisn = inputValue.trim();
                setInputValue('');
                
                if (!nisn) return;

                const student = students.find(s => s.nisn === nisn);
                
                if (!student) {
                    showResult(null, 'error', 'Data siswa tidak ditemukan.');
                    return;
                }

                try {
                    const result = await addAttendance(student);
                    if (result.success) {
                        showResult(student, 'success', result.status, result.time);
                    } else {
                        showResult(student, 'duplicate', 'Absensi sudah tercatat hari ini.');
                    }
                } catch (error) {
                    showResult(null, 'error', 'Terjadi kesalahan sistem.');
                }

                            {scanStatus === 'ready' && (
                                <div className="text-center animate-fade-in">
                                    <div className="w-32 h-32 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6 relative">
                                        <div className="absolute inset-0 rounded-full border-4 border-blue-500 opacity-20 animate-pulse-ring"></div>
                                        <Icon name="scan-line" size={48} className="text-blue-600 relative z-10" />
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800">SIAP SCAN QR CODE</h2>
                                    <p className="text-gray-500 mt-2">Arahkan QR Code ke scanner</p>
                                </div>
                            )}

                            {scanStatus === 'success' && scanResult?.student && (
                                <div className="text-center animate-fade-in w-full">
                                    <div className="bg-emerald-100 text-emerald-700 py-2 px-6 rounded-full inline-flex items-center gap-2 font-bold mb-6">
                                        <Icon name="check-circle" size={20} /> SCAN BERHASIL
                                    </div>
                                    
                                    {scanResult.student.photoUrl ? (
                                        <img src={scanResult.student.photoUrl} alt="Foto" className="w-40 h-40 object-cover rounded-2xl mx-auto shadow-lg mb-6 border-4 border-white" />
                                    ) : (
                                        <div className="w-40 h-40 bg-gray-200 rounded-2xl mx-auto shadow-lg mb-6 flex items-center justify-center">
                                            <Icon name="user" size={48} className="text-gray-400" />
                                        </div>
                                    )}

                                    <h2 className="text-3xl font-bold text-gray-900 mb-1">{scanResult.student.name}</h2>
                                    <p className="text-lg text-gray-600 mb-4">Kelas {scanResult.student.className} • {scanResult.student.nisn}</p>
                                    
                                    <div className={`text-2xl font-bold p-4 rounded-xl ${scanResult.message === 'HADIR' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>
                                        {scanResult.message} - {scanResult.time} WIT
                                    </div>
                                </div>
                            )}

                            {scanStatus === 'error' && (
                                <div className="text-center animate-fade-in">
                                    <div className="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icon name="x-circle" size={40} className="text-red-500" />
                                    </div>
                                    <h2 className="text-xl font-bold text-red-600 mb-2">GAGAL</h2>
                                    <p className="text-gray-700">{scanResult?.message}</p>
                                </div>
                            )}

                            {scanStatus === 'duplicate' && (
                                <div className="text-center animate-fade-in">
                                    <div className="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icon name="alert-triangle" size={40} className="text-amber-500" />
                                    </div>
                                    <h2 className="text-xl font-bold text-amber-600 mb-2">SUDAH TERCATAT</h2>
                                    <p className="text-gray-700">{scanResult?.message}</p>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const DataSiswaView = ({ students }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [uploading, setUploading] = useState(false);
            const [toast, setToast] = useState(null);

            const filteredStudents = useMemo(() => {
                return students.filter(s => 
                    s.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    s.nisn.includes(searchTerm) ||
                    s.className.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [students, searchTerm]);

            const downloadTemplate = () => {
                const ws = XLSX.utils.json_to_sheet([{ No: 1, 'Nama Siswa': 'Budi Santoso', NISN: '1234567890', 'Nomor HP Orang Tua': '081234567890', Kelas: '7A' }]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
                XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setUploading(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        const batch = writeBatch(db);
                        let successCount = 0;

                        for (const row of data) {
                            if (row.NISN && row['Nama Siswa'] && row.Kelas) {
                                const nisnStr = String(row.NISN).trim();
                                const docRef = doc(db, 'students', nisnStr);
                                batch.set(docRef, {
                                    nisn: nisnStr,
                                    name: row['Nama Siswa'],
                                    className: row.Kelas,
                                    parentPhone: row['Nomor HP Orang Tua'] ? String(row['Nomor HP Orang Tua']).trim() : '',
                                    createdAt: serverTimestamp()
                                }, { merge: true });
                                successCount++;
                            }
                        }

                        await batch.commit();
                        setToast({ type: 'success', message: `${successCount} data siswa berhasil diimport/update.` });
                    } catch (error) {
                        console.error(error);
                        setToast({ type: 'error', message: "Gagal memproses file Excel." });
                    }
                    setUploading(false);
                    e.target.value = null;
                };
                reader.readAsBinaryString(file);
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full animate-fade-in">
                    {toast && <Toast type={toast.type} message={toast.message} onClose={() => setToast(null)} />}
                    
                    <div className="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="relative w-full md:w-96">
                            <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                            <input 
                                type="text" 
                                placeholder="Cari nama, NISN, atau kelas..." 
                                className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <Button variant="secondary" onClick={downloadTemplate}>
                                <Icon name="download" size={16} /> Template
                            </Button>
                            <div>
                                <input type="file" id="excel-upload" accept=".xlsx, .xls" className="hidden" onChange={handleFileUpload} />
                                <label htmlFor="excel-upload" className={`cursor-pointer px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 bg-emerald-500 text-white hover:bg-emerald-600 shadow-md ${uploading ? 'opacity-50 pointer-events-none' : ''}`}>
                                    <Icon name={uploading ? 'loader' : 'upload'} size={16} className={uploading ? 'animate-spin' : ''} />
                                    {uploading ? 'Memproses...' : 'Import Excel'}
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto">
                        <table className="w-full text-left border-collapse">
                            <thead className="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th className="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider">No</th>
                                    <th className="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider">NISN</th>
                                    <th className="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider">Nama Siswa</th>
                                    <th className="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider">Kelas</th>
                                    <th className="py-3 px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider">No. HP Ortu</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {filteredStudents.map((student, idx) => (
                                    <tr key={student.nisn} className="hover:bg-gray-50 transition-colors">
                                        <td className="py-3 px-6 text-sm text-gray-600">{idx + 1}</td>
                                        <td className="py-3 px-6 text-sm font-medium text-gray-800">{student.nisn}</td>
                                        <td className="py-3 px-6 text-sm text-gray-800">{student.name}</td>
                                        <td className="py-3 px-6 text-sm text-gray-600">
                                            <span className="bg-blue-50 text-blue-700 py-1 px-2 rounded font-medium text-xs">
                                                {student.className}
                                            </span>
                                        </td>
                                        <td className="py-3 px-6 text-sm text-gray-600">{student.parentPhone || '-'}</td>
                                    </tr>
                                ))}
                                {filteredStudents.length === 0 && (
                                    <tr>
                                        <td colSpan="5" className="py-8 text-center text-gray-500">
                                            Tidak ada data siswa ditemukan.
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    <div className="p-4 border-t border-gray-100 text-sm text-gray-500 bg-gray-50">
                        Total {filteredStudents.length} siswa terdaftar.
                    </div>
                </div>
            );
        };

        const ReportsView = ({ students, attendances }) => {
            const [reportDate, setReportDate] = useState(formatDate(getWITTime()));

            const exportDaily = () => {
                const todayAttendances = attendances.filter(a => a.date === reportDate);
                
                const data = students.map((s, index) => {
                    const att = todayAttendances.find(a => a.nisn === s.nisn);
                    return {
                        'No': index + 1,
                        'NISN': s.nisn,
                        'Nama Siswa': s.name,
                        'Kelas': s.className,
                        'Status': att ? att.status : 'TIDAK HADIR',
                        'Jam': att ? att.time : '-'
                    };
                });

                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Rekap Harian");
                XLSX.writeFile(wb, `Rekap_Absen_${reportDate}.xlsx`);
            };

            const classes = [...new Set(students.map(s => s.className))].sort();

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 animate-fade-in">
                    <h2 className="text-xl font-bold text-gray-800 mb-6">Rekapan Absensi Harian</h2>
                    
                    <div className="flex flex-col sm:flex-row gap-4 items-end mb-8 bg-blue-50 p-4 rounded-xl border border-blue-100">
                        <div className="flex-1">
                            <label className="block text-sm font-medium text-gray-700 mb-1">Pilih Tanggal</label>
                            <input 
                                type="date" 
                                value={reportDate}
                                onChange={(e) => setReportDate(e.target.value)}
                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            />
                        </div>
                        <Button onClick={exportDaily} className="w-full sm:w-auto flex-shrink-0">
                            <Icon name="download" size={18} /> Download Excel
                        </Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {classes.map(cls => {
                            const clsStudents = students.filter(s => s.className === cls);
                            const clsAtts = attendances.filter(a => a.date === reportDate && clsStudents.some(s => s.nisn === a.nisn));
                            const present = clsAtts.filter(a => a.status === 'HADIR').length;
                            const late = clsAtts.filter(a => a.status === 'TERLAMBAT').length;
                            const totalScanned = present + late;
                            
                            return (
                                <div key={cls} className="border border-gray-200 rounded-xl p-4 hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                                        <h3 className="font-bold text-lg text-gray-800">Kelas {cls}</h3>
                                        <span className="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">
                                            {totalScanned}/{clsStudents.length} Siswa
                                        </span>
                                    </div>
                                    <div className="space-y-2 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-500">Hadir Tepat Waktu</span>
                                            <span className="font-semibold text-emerald-600">{present}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-500">Terlambat</span>
                                            <span className="font-semibold text-amber-600">{late}</span>
                                        </div>
                                        <div className="flex justify-between border-t border-gray-100 pt-2 mt-2">
                                            <span className="text-gray-500">Tidak Hadir (Alpha)</span>
                                            <span className="font-semibold text-red-600">{clsStudents.length - totalScanned}</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const GuideView = () => (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8 max-w-4xl mx-auto animate-fade-in prose prose-blue">
                <h2 className="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Panduan Penggunaan Aplikasi</h2>
                
                <div className="space-y-6 text-gray-600">
                    <div>
                        <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="scan-line" className="text-blue-500"/> 1. Cara Melakukan Scan</h3>
                        <p>Buka menu <strong>Scan Hari Ini</strong>. Pastikan kursor tidak berada di input text manapun. Arahkan scanner QR Code ke kartu siswa. Aplikasi akan otomatis mendeteksi dan menyimpan data.</p>
                    </div>
                    <div>
                        <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="clock" className="text-blue-500"/> 2. Aturan Keterlambatan</h3>
                        <p>Batas waktu kehadiran adalah pukul <strong>07:20 WIT</strong>. Scan sebelum atau tepat 07:20 akan berstatus <strong>HADIR</strong>. Lewat dari itu berstatus <strong>TERLAMBAT</strong>.</p>
                    </div>
                    <div>
                        <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="message-circle" className="text-blue-500"/> 3. Notifikasi WhatsApp</h3>
                        <p>Pesan WhatsApp dikirim secara otomatis di latar belakang dengan sistem antrean (maksimal 5 pesan, jeda 5 menit). Jangan khawatir jika status WhatsApp masih 'Menunggu', proses tetap berjalan.</p>
                    </div>
                    <div>
                        <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Icon name="upload" className="text-blue-500"/> 4. Import Data Siswa</h3>
                        <p>Ke menu <strong>Data Siswa</strong>, klik <strong>Template</strong> untuk mendownload format Excel. Isi data, lalu klik <strong>Import Excel</strong> untuk mengunggah massal.</p>
                    </div>
                </div>
            </div>
        );

        const AppContent = ({ activeView }) => {
            const [students, setStudents] = useState([]);
            const [attendances, setAttendances] = useState([]);
            const [waStatus, setWaStatus] = useState({ queued: 0, sent: 0, failed: 0 });
            
            // Listeners Data Realtime
            useEffect(() => {
                // Students
                const unsubStudents = onSnapshot(collection(db, 'students'), (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push(doc.data()));
                    setStudents(data);
                });

                // Attendances Hari Ini
                const today = formatDate(getWITTime());
                const qAtt = query(collection(db, 'attendances'), where('date', '==', today));
                const unsubAtt = onSnapshot(qAtt, (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push(doc.data()));
                    setAttendances(data);
                });

                // WA Queue Status Hari Ini
                const todayStart = new Date(today);
                const qWa = query(collection(db, 'whatsappQueue'), orderBy('createdAt', 'desc'), limit(100)); // Simplified for frontend memory
                const unsubWa = onSnapshot(qWa, (snapshot) => {
                    let q = 0, s = 0, f = 0;
                    snapshot.forEach(doc => {
                        const stat = doc.data().status;
                        if (stat === 'QUEUED' || stat === 'RETRY') q++;
                        else if (stat === 'SENT') s++;
                        else if (stat === 'FAILED_FINAL') f++;
                    });
                    setWaStatus({ queued: q, sent: s, failed: f });
                });

                return () => { unsubStudents(); unsubAtt(); unsubWa(); };
            }, []);

            // Core Logic: Tambah Absensi
            const addAttendance = async (student) => {
                const now = getWITTime();
                const dateStr = formatDate(now);
                const timeStr = formatTime(now);
                const compositeKey = `${dateStr}_${student.nisn}`;
                
                const isLate = now.getHours() > 7 || (now.getHours() === 7 && now.getMinutes() > 20);
                const status = isLate ? 'TERLAMBAT' : 'HADIR';

                const attRef = doc(db, 'attendances', compositeKey);
                
                try {
                    const docSnap = await getDoc(attRef);
                    if (docSnap.exists()) {
                        return { success: false, error: 'duplicate' };
                    }

                    const batch = writeBatch(db);
                    
                    // Simpan Absen
                    batch.set(attRef, {
                        nisn: student.nisn,
                        studentName: student.name,
                        className: student.className,
                        date: dateStr,
                        time: timeStr,
                        status: status,
                        timestamp: serverTimestamp()
                    });

                    // Masukkan ke WA Queue jika ada nomor HP
                    if (student.parentPhone) {
                        const waQueueRef = doc(collection(db, 'whatsappQueue'));
                        
                        // Template Pesan Bervariasi
                        const templatesHadir = [
                            `Yth. Bapak/Ibu Orang Tua/Wali, kami informasikan bahwa Ananda ${student.name}, kelas ${student.className}, telah hadir di SMPN 6 Manokwari pada ${dateStr} pukul ${timeStr} WIT (HADIR). Terima kasih.`,
                            `Selamat pagi Bapak/Ibu. Pemberitahuan bahwa siswa ${student.name} (Kelas ${student.className}) telah tercatat hadir di sekolah pukul ${timeStr} WIT. Terima kasih atas perhatiannya.`
                        ];
                        const templatesTerlambat = [
                            `Yth. Bapak/Ibu, ananda ${student.name} (Kelas ${student.className}) telah tiba di sekolah pada pukul ${timeStr} WIT dan berstatus TERLAMBAT. Mohon kerjasamanya agar besok bisa lebih awal.`,
                            `Pemberitahuan dari SMPN 6 Manokwari: Siswa ${student.name}, kelas ${student.className} tercatat TERLAMBAT pada hari ini pukul ${timeStr} WIT.`
                        ];

                        const msgArray = isLate ? templatesTerlambat : templatesHadir;
                        const message = msgArray[Math.floor(Math.random() * msgArray.length)];

                        batch.set(waQueueRef, {
                            attendanceId: compositeKey,
                            nisn: student.nisn,
                            parentPhone: student.parentPhone,
                            message: message,
                            status: 'QUEUED',
                            createdAt: serverTimestamp(),
                            attempts: 0
                        });
                    }

                    await batch.commit();
                    return { success: true, status, time: timeStr };

                } catch (error) {
                    console.error("Gagal simpan absen:", error);
                    throw error;
                }
            };

            // Router sederhana
            switch (activeView) {
                case 'dashboard': return <DashboardView students={students} attendances={attendances} waStatus={waStatus} />;
                case 'scan': return <ScanView students={students} addAttendance={addAttendance} />;
                case 'students': return <DataSiswaView students={students} />;
                case 'reports': return <ReportsView students={students} attendances={attendances} />;
                case 'guide': return <GuideView />;
                default: return <DashboardView students={students} attendances={attendances} waStatus={waStatus} />;
            }
        };

        const App = () => {
            const [user, setUser] = useState(undefined); // undefined = loading, null = not auth
            const [refreshKey, setRefreshKey] = useState(0);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser && currentUser.email === ALLOWED_EMAIL) {
                        setUser(currentUser);
                    } else {
                        setUser(null);
                        if (currentUser) signOut(auth); // Force out if wrong email cached
                    }
                });
                return () => unsubscribe();
            }, []);

            useWAQueueWorker(user); // Start background worker if logged in

            const handleSoftRefresh = () => {
                setRefreshKey(prev => prev + 1); // Trigger re-mount of data components
            };

            if (user === undefined) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-blue-900">
                        <Icon name="loader" size={48} className="text-white animate-spin" />
                    </div>
                );
            }

            if (!user) {
                return <LoginScreen />;
            }

            return (
                <MainLayout user={user} onRefresh={handleSoftRefresh}>
                    <AppContent key={refreshKey} />
                </MainLayout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
