<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSENSI SISWA SMP NEGERI 6 MANOKWARI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        school: {
                            blue: '#1e3a8a',
                            darkBlue: '#0f172a',
                            lightBlue: '#3b82f6',
                            accent: '#2563eb',
                            bg: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Dexie.js for IndexedDB -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

    <!-- SheetJS (XLSX) for Excel Export/Import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Custom Print Styles */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white;
                color: black;
            }
            .shadow-lg, .shadow-md, .shadow-sm {
                box-shadow: none !important;
            }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const db = new Dexie("AbsensiSMPN6ManokwariDB");
        db.version(1).stores({
            students: "++id, nisn, name, class, parentPhone",
            attendance: "id, date, nisn, studentId, studentName, class, status, scanTime, timestamp",
            whatsappQueue: "++id, nisn, studentName, class, parentPhone, date, status, scheduledAt, uniqueKey",
            whatsappLogs: "++id, queueId, nisn, parentPhone, sentAt, status, templateId",
            settings: "id",
            templates: "++id, type, content, isActive"
        });

        // App Constants & Auth Configuration
        const AUTH_CONFIG = {
            username: "proktorsmp6",
            password: "60400173",
            schoolName: "SMP NEGERI 6 MANOKWARI",
            logoUrl: "https://i.ibb.co.com/JWy6dhzM/LOGO-SMP6-1-removebg-preview.png"
        };

        const generate200Templates = () => {
            const templates = [];
            
            // HADIR Templates (100 Variations)
            const hadirGreetings = [
                "Yth. Bapak/Ibu Orang Tua/Wali,",
                "Kepada Yth. Bapak/Ibu Wali dari",
                "Salam Hormat Bapak/Ibu,",
                "Pemberitahuan Kehadiran Siswa -",
                "Informasi Kehadiran SMPN 6 Manokwari:"
            ];
            const hadirOpeners = [
                "Kami sampaikan bahwa ananda",
                "Dengan ini kami informasikan bahwa",
                "Diberitahukan bahwa siswa atas nama",
                "Sistem absensi mencatat bahwa ananda",
                "Kami menginformasikan kehadiran ananda"
            ];
            const hadirClosers = [
                "Terima kasih atas perhatian dan kerja sama Bapak/Ibu.",
                "Demikian informasi ini kami sampaikan. Terima kasih.",
                "Salam hangat dari pihak sekolah SMP Negeri 6 Manokwari.",
                "Mari tingkatkan kedisiplinan dan keberhasilan belajar ananda.",
                "Atas kerja sama Bapak/Ibu, kami ucapkan terima kasih."
            ];

            let countHadir = 1;
            for (let g of hadirGreetings) {
                for (let o of hadirOpeners) {
                    for (let c of hadirClosers) {
                        if (countHadir <= 100) {
                            templates.push({
                                id: `HADIR-${String(countHadir).padStart(3, '0')}`,
                                type: 'HADIR',
                                content: `${g}\n\n${o} [NAMA] (Kelas [KELAS]) telah melakukan absensi di SMP Negeri 6 Manokwari.\n\nHari/Tanggal: [HARI], [TANGGAL]\nWaktu Absen: [JAM] WIT\nStatus: HADIR (Tepat Waktu) ✅\n\n${c}`
                            });
                            countHadir++;
                        }
                    }
                }
            }

            // TERLAMBAT Templates (100 Variations)
            const terlambatGreetings = [
                "Yth. Bapak/Ibu Orang Tua/Wali,",
                "Pemberitahuan Keterlambatan Siswa -",
                "Salam Hormat Bapak/Ibu,",
                "Perhatian: Informasi Kehadiran Siswa,",
                "Yth. Orang Tua/Wali Murid,"
            ];
            const terlambatOpeners = [
                "Kami menginformasikan bahwa ananda",
                "Sistem absensi mencatat keterlambatan ananda",
                "Diberitahukan bahwa siswa atas nama",
                "Dengan ini kami sampaikan bahwa ananda",
                "Mohon perhatian, ananda"
            ];
            const terlambatClosers = [
                "Mohon bimbingan dan kerja sama Bapak/Ibu agar ananda dapat berangkat lebih awal.",
                "Mari bersama mendidik kedisiplinan waktu belajar ananda di sekolah.",
                "Diharapkan perhatian Bapak/Ibu demi ketertiban absensi ananda.",
                "Atas perhatian dan penanganan dari Bapak/Ibu, kami ucapkan terima kasih.",
                "Semoga ke depannya ananda dapat hadir tepat waktu sebelum pukul 07.20 WIT."
            ];

            let countTerlambat = 1;
            for (let g of terlambatGreetings) {
                for (let o of terlambatOpeners) {
                    for (let c of terlambatClosers) {
                        if (countTerlambat <= 100) {
                            templates.push({
                                id: `TERLAMBAT-${String(countTerlambat).padStart(3, '0')}`,
                                type: 'TERLAMBAT',
                                content: `${g}\n\n${o} [NAMA] (Kelas [KELAS]) tercatat HADIR TERLAMBAT.\n\nHari/Tanggal: [HARI], [TANGGAL]\nWaktu Absen: [JAM] WIT\nStatus: TERLAMBAT ⚠️\n\n${c}`
                            });
                            countTerlambat++;
                        }
                    }
                }
            }

            return templates;
        };

        const SYSTEM_TEMPLATES = generate200Templates();

        const getFormattedDate = (d = new Date()) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getFormattedTimeWIT = (d = new Date()) => {
            // Indonesia Eastern Time (WIT) is UTC+9
            const options = { timeZone: 'Asia/Jayapura', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            return new Intl.DateTimeFormat('id-ID', options).format(d).replace(/\./g, ':');
        };

        const getIndonesianDayName = (d = new Date()) => {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            return days[d.getDay()];
        };

        const getIndonesianFormattedDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        };

        const initDefaultData = async () => {
            const settingsCount = await db.settings.count();
            if (settingsCount === 0) {
                await db.settings.put({
                    id: 'app_config',
                    schoolName: 'SMP NEGERI 6 MANOKWARI',
                    cutoffTime: '07:20',
                    timezone: 'Asia/Jayapura',
                    whatsappApiUrl: 'https://api.whatsapp-provider-example.com/send',
                    whatsappApiKey: 'JS3EZBCY67FH36ygwLgE',
                    batchSize: 5,
                    pauseMinutes: 5,
                    maxRetry: 5,
                    holidays: []
                });
            }

            const studentCount = await db.students.count();
            if (studentCount === 0) {
                // Seed sample Papuan & Indonesian students for demonstration
                const sampleStudents = [
                    { nisn: '0058123456', name: 'Maria Alfonsina', class: '8B', parentPhone: '081248001122', photoUrl: '' },
                    { nisn: '0058123457', name: 'Yohanes Wenda', class: '8B', parentPhone: '081248001123', photoUrl: '' },
                    { nisn: '0058123458', name: 'Budi Santoso', class: '8A', parentPhone: '081248001124', photoUrl: '' },
                    { nisn: '0058123459', name: 'Agustina Rumbewas', class: '7A', parentPhone: '081248001125', photoUrl: '' },
                    { nisn: '0058123460', name: 'Kornelis Mandacan', class: '9A', parentPhone: '081248001126', photoUrl: '' },
                    { nisn: '0058123461', name: 'Siti Aminah', class: '7B', parentPhone: '081248001127', photoUrl: '' },
                    { nisn: '0058123462', name: 'Daniel Tabuni', class: '9B', parentPhone: '081248001128', photoUrl: '' }
                ];
                await db.students.bulkAdd(sampleStudents);
            }
        };

        const { useState, useEffect, useRef, useMemo } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(() => {
                return localStorage.getItem('smpn6_proctor_session') === 'active';
            });
            const [currentTab, setCurrentTab] = useState('scan');
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [settings, setSettings] = useState(null);
            const [students, setStudents] = useState([]);
            const [lastScannedStudent, setLastScannedStudent] = useState(null);
            const [duplicateAlert, setDuplicateAlert] = useState(null);
            const [waQueueCount, setWaQueueCount] = useState(0);

            // Load initial settings & student list
            useEffect(() => {
                initDefaultData().then(() => {
                    loadAppData();
                });

                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            const loadAppData = async () => {
                const config = await db.settings.get('app_config');
                setSettings(config || {});
                const studentList = await db.students.toArray();
                setStudents(studentList);
                
                // Update WA Queue pending count
                const pendingWa = await db.whatsappQueue.where('status').equals('QUEUED').or('status').equals('QUEUED_OFFLINE').count();
                setWaQueueCount(pendingWa);
            };

            const handleLogin = (user, pass) => {
                if (user === AUTH_CONFIG.username && pass === AUTH_CONFIG.password) {
                    localStorage.setItem('smpn6_proctor_session', 'active');
                    setIsLoggedIn(true);
                    return true;
                }
                return false;
            };

            const handleLogout = () => {
                localStorage.removeItem('smpn6_proctor_session');
                setIsLoggedIn(false);
            };

            if (!isLoggedIn) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden font-sans">
                    {}
                    <aside className="w-64 bg-slate-900 text-slate-100 flex flex-col justify-between shadow-xl z-20 no-print">
                        <div>
                            {/* Header Logo & Title */}
                            <div className="p-4 bg-slate-950 flex items-center space-x-3 border-b border-slate-800">
                                <img 
                                    src={AUTH_CONFIG.logoUrl} 
                                    alt="Logo SMPN 6" 
                                    className="w-12 h-12 object-contain rounded-md" 
                                    onError={(e) => { e.target.src = 'https://via.placeholder.com/48?text=SMP6'; }}
                                />
                                <div>
                                    <h1 className="font-bold text-sm tracking-wide leading-tight text-white">ABSENSI SISWA</h1>
                                    <p className="text-xs text-blue-400 font-semibold">SMPN 6 MANOKWARI</p>
                                </div>
                            </div>

                            {/* Navigation Menu */}
                            <nav className="mt-4 px-2 space-y-1">
                                <NavItem icon="fa-qrcode" label="Scan Hari Ini" active={currentTab === 'scan'} onClick={() => setCurrentTab('scan')} badge="UTAMA" />
                                <NavItem icon="fa-chart-pie" label="Dashboard" active={currentTab === 'dashboard'} onClick={() => setCurrentTab('dashboard')} />
                                <NavItem icon="fa-users" label="Data Siswa" active={currentTab === 'students'} onClick={() => setCurrentTab('students')} badge={students.length} />
                                <NavItem icon="fa-calendar-day" label="Rekap Harian" active={currentTab === 'rekap-harian'} onClick={() => setCurrentTab('rekap-harian')} />
                                <NavItem icon="fa-calendar-week" label="Rekap Mingguan" active={currentTab === 'rekap-mingguan'} onClick={() => setCurrentTab('rekap-mingguan')} />
                                <NavItem icon="fa-calendar-alt" label="Rekap Bulanan" active={currentTab === 'rekap-bulanan'} onClick={() => setCurrentTab('rekap-bulanan')} />
                                <NavItem icon="fa-paper-plane" label="Queue WhatsApp" active={currentTab === 'whatsapp'} onClick={() => setCurrentTab('whatsapp')} badge={waQueueCount > 0 ? waQueueCount : null} badgeColor="bg-amber-500" />
                                <NavItem icon="fa-book" label="Panduan" active={currentTab === 'guide'} onClick={() => setCurrentTab('guide')} />
                                <NavItem icon="fa-cog" label="Pengaturan" active={currentTab === 'settings'} onClick={() => setCurrentTab('settings')} />
                            </nav>
                        </div>

                        {/* Sidebar Footer User Info & Logout */}
                        <div className="p-4 border-t border-slate-800 bg-slate-950/50">
                            <div className="flex items-center space-x-3 mb-3">
                                <div className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold">
                                    PRO
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-xs font-medium text-slate-300 truncate">● Login sebagai Proktor</p>
                                    <p className="text-xs font-bold text-blue-400 truncate">{AUTH_CONFIG.username}</p>
                                </div>
                            </div>
                            <button 
                                onClick={handleLogout}
                                className="w-full py-2 px-3 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center transition-colors duration-150"
                            >
                                <i className="fas fa-sign-out-alt mr-2"></i> Logout
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                        {}
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10 no-print">
                            <div className="flex items-center space-x-3">
                                <h2 className="text-lg font-bold text-slate-800 uppercase tracking-wide">
                                    {currentTab === 'scan' && '📷 SCANNER QR ABSENSI'}
                                    {currentTab === 'dashboard' && '📊 DASHBOARD MONITORING'}
                                    {currentTab === 'students' && '📚 MANAJEMEN DATA SISWA'}
                                    {currentTab === 'rekap-harian' && '🗓️ REKAP ABSENSI HARIAN'}
                                    {currentTab === 'rekap-mingguan' && '📅 REKAP ABSENSI MINGGUAN'}
                                    {currentTab === 'rekap-bulanan' && '🗓️ REKAP ABSENSI BULANAN'}
                                    {currentTab === 'whatsapp' && '💬 ANTREAN NOTIFIKASI WHATSAPP'}
                                    {currentTab === 'guide' && '📖 PANDUAN PENGGUNAAN APLIKASI'}
                                    {currentTab === 'settings' && '⚙️ PENGATURAN SISTEM'}
                                </h2>
                            </div>

                            {/* Network Connectivity Status Badge */}
                            <div className="flex items-center space-x-4">
                                <div className={`flex items-center px-3 py-1.5 rounded-full text-xs font-bold shadow-sm ${
                                    isOnline ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'
                                }`}>
                                    <span className={`w-2.5 h-2.5 rounded-full mr-2 ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
                                    {isOnline ? '🟢 ONLINE (SIAP SINKRON)' : '🔴 OFFLINE (MODE LOKAL)'}
                                </div>
                                <div className="text-xs text-slate-500 font-mono bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                                    WIT: <span className="font-bold text-slate-700">{getFormattedTimeWIT()}</span>
                                </div>
                            </div>
                        </header>

                        {/* Body Router Content */}
                        <main className="flex-1 overflow-y-auto p-6 bg-slate-100">
                            {currentTab === 'scan' && (
                                <ScanPage 
                                    settings={settings} 
                                    students={students}
                                    lastScannedStudent={lastScannedStudent}
                                    setLastScannedStudent={setLastScannedStudent}
                                    duplicateAlert={duplicateAlert}
                                    setDuplicateAlert={setDuplicateAlert}
                                    onDataUpdated={loadAppData}
                                />
                            )}
                            {currentTab === 'dashboard' && <DashboardPage students={students} />}
                            {currentTab === 'students' && <StudentManagementPage students={students} onDataUpdated={loadAppData} />}
                            {currentTab === 'rekap-harian' && <RekapHarianPage students={students} />}
                            {currentTab === 'rekap-mingguan' && <RekapMingguanPage students={students} />}
                            {currentTab === 'rekap-bulanan' && <RekapBulananPage students={students} />}
                            {currentTab === 'whatsapp' && <WhatsAppQueuePage onDataUpdated={loadAppData} isOnline={isOnline} />}
                            {currentTab === 'guide' && <UserGuidePage />}
                            {currentTab === 'settings' && <SettingsPage settings={settings} onDataUpdated={loadAppData} />}
                        </main>

                        {/* Footer */}
                        <footer className="h-10 bg-white border-t border-slate-200 flex items-center justify-between px-6 text-xs text-slate-500 no-print">
                            <span>ABSENSI SISWA SMP NEGERI 6 MANOKWARI</span>
                            <span className="italic">"Dikembangkan untuk mendukung layanan administrasi sekolah yang cepat, modern, dan terintegrasi."</span>
                        </footer>
                    </div>
                </div>
            );
        }

        // Sidebar Navigation Button Helper
        function NavItem({ icon, label, active, onClick, badge, badgeColor = "bg-blue-600" }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium transition-all duration-150 ${
                        active 
                            ? 'bg-blue-600 text-white font-semibold shadow-md' 
                            : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                >
                    <div className="flex items-center space-x-3">
                        <i className={`fas ${icon} w-5 text-center text-sm ${active ? 'text-white' : 'text-slate-400'}`}></i>
                        <span>{label}</span>
                    </div>
                    {badge !== null && badge !== undefined && (
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold text-white ${badgeColor}`}>
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const success = onLogin(username, password);
                if (!success) {
                    setErrorMsg('Username atau Password Proktor salah!');
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                    {/* Soft background accents */}
                    <div className="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
                    <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>

                    <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden z-10 border border-slate-100">
                        <div className="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 p-8 text-center text-white relative">
                            <img 
                                src={AUTH_CONFIG.logoUrl} 
                                alt="Logo SMPN 6 Manokwari" 
                                className="w-24 h-24 mx-auto mb-4 object-contain drop-shadow-md"
                                onError={(e) => { e.target.src = 'https://via.placeholder.com/96?text=SMPN+6'; }}
                            />
                            <h1 className="text-xl font-extrabold tracking-wide">ABSENSI SISWA</h1>
                            <p className="text-sm font-semibold text-blue-300">SMP NEGERI 6 MANOKWARI</p>
                            <p className="text-xs text-slate-300 mt-2 font-light">"Monitoring Kehadiran Siswa Berbasis QR Code"</p>
                        </div>

                        <form onSubmit={handleSubmit} className="p-8 space-y-5">
                            {errorMsg && (
                                <div className="p-3 bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-xs rounded font-medium flex items-center">
                                    <i className="fas fa-exclamation-circle text-base mr-2"></i>
                                    {errorMsg}
                                </div>
                            )}

                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                        <i className="fas fa-user"></i>
                                    </span>
                                    <input 
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        placeholder="Masukkan username proktor"
                                        className="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
                                        required
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                        <i className="fas fa-lock"></i>
                                    </span>
                                    <input 
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="Masukkan password proktor"
                                        className="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition"
                                        required
                                    />
                                </div>
                            </div>

                            <button
                                type="submit"
                                className="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg shadow-lg hover:shadow-blue-600/30 transition-all duration-200 text-sm tracking-wide"
                            >

        function ScanPage({ settings, students, lastScannedStudent, setLastScannedStudent, duplicateAlert, setDuplicateAlert, onDataUpdated }) {
            const [scanInput, setScanInput] = useState('');
            const [todayScans, setTodayScans] = useState([]);
            const [scanStats, setScanStats] = useState({ total: 0, scanned: 0, hadir: 0, terlambat: 0, belum: 0 });
            const inputRef = useRef(null);

            const todayDate = getFormattedDate();

            // Always keep focus on scanner input
            useEffect(() => {
                const interval = setInterval(() => {
                    if (inputRef.current && document.activeElement !== inputRef.current) {
                        inputRef.current.focus();
                    }
                }, 1000);
                loadTodayAttendance();
                return () => clearInterval(interval);
            }, [students]);

            const loadTodayAttendance = async () => {
                const records = await db.attendance.where('date').equals(todayDate).reverse().sortBy('timestamp');
                setTodayScans(records);

                const scannedCount = records.length;
                const hadirCount = records.filter(r => r.status === 'HADIR').length;
                const terlambatCount = records.filter(r => r.status === 'TERLAMBAT').length;
                const totalStudents = students.length;

                setScanStats({
                    total: totalStudents,
                    scanned: scannedCount,
                    hadir: hadirCount,
                    terlambat: terlambatCount,
                    belum: Math.max(0, totalStudents - scannedCount)
                });
            };

            const handleScanSubmit = async (e) => {
                e.preventDefault();
                const cleanNisn = scanInput.trim();
                setScanInput('');

                if (!cleanNisn) return;

                // 1. Find Student by NISN
                const student = students.find(s => s.nisn === cleanNisn);

                if (!student) {
                    setDuplicateAlert({
                        type: 'NOT_FOUND',
                        title: '⚠️ SISWA TIDAK DITEMUKAN',
                        nisn: cleanNisn,
                        message: `Data siswa dengan NISN "${cleanNisn}" belum terdaftar dalam sistem.`
                    });
                    return;
                }

                // 2. Check Duplicate Attendance Today (ID format: YYYY-MM-DD_NISN)
                const attendanceId = `${todayDate}_${cleanNisn}`;
                const existingAttendance = await db.attendance.get(attendanceId);

                if (existingAttendance) {
                    // DUPLICATE SCAN REJECTED
                    setDuplicateAlert({
                        type: 'DUPLICATE',
                        title: '⚠️ SCAN DUPLIKAT TERDETEKSI',
                        studentName: student.name,
                        nisn: student.nisn,
                        class: student.class,
                        firstScanTime: existingAttendance.scanTime,
                        status: existingAttendance.status,
                        message: 'Absensi siswa ini sudah tercatat hari ini. Scan kedua ditolak.'
                    });
                    return;
                }

                // 3. Determine Attendance Status based on cutoff time (e.g., 07:20 WIT)
                const currentTimeWIT = getFormattedTimeWIT();
                const cutoff = settings?.cutoffTime || '07:20';
                
                // Compare "HH:MM"
                const isLate = currentTimeWIT.substring(0, 5) > cutoff;
                const status = isLate ? 'TERLAMBAT' : 'HADIR';

                const newAttendance = {
                    id: attendanceId,
                    date: todayDate,
                    nisn: student.nisn,
                    studentId: student.id,
                    studentName: student.name,
                    class: student.class,
                    status: status,
                    scanTime: currentTimeWIT,
                    timestamp: Date.now()
                };

                // 4. Save Attendance in IndexedDB
                await db.attendance.put(newAttendance);

                // 5. Select & Push WhatsApp Notification Queue
                const activeTemplates = SYSTEM_TEMPLATES.filter(t => t.type === status);
                const randomTemplate = activeTemplates[Math.floor(Math.random() * activeTemplates.length)];

                // Replace template variables
                let waMessage = randomTemplate.content
                    .replace(/\[NAMA\]/g, student.name)
                    .replace(/\[KELAS\]/g, student.class)
                    .replace(/\[TANGGAL\]/g, getIndonesianFormattedDate(todayDate))
                    .replace(/\[HARI\]/g, getIndonesianDayName())
                    .replace(/\[JAM\]/g, currentTimeWIT);

                const waUniqueKey = `${todayDate}_${student.nisn}_NOTIFICATION`;

                // Anti-duplicate WA queue check
                const existingQueue = await db.whatsappQueue.where('uniqueKey').equals(waUniqueKey).first();
                if (!existingQueue && student.parentPhone) {
                    await db.whatsappQueue.add({
                        uniqueKey: waUniqueKey,
                        nisn: student.nisn,
                        studentName: student.name,
                        class: student.class,
                        parentPhone: student.parentPhone,
                        date: todayDate,
                        scanTime: currentTimeWIT,
                        status: navigator.onLine ? 'QUEUED' : 'QUEUED_OFFLINE',
                        message: waMessage,
                        templateId: randomTemplate.id,
                        attempts: 0,
                        scheduledAt: Date.now()
                    });
                }

                // 6. Update UI State & Last Scanned Student
                setLastScannedStudent({
                    ...student,
                    scanTime: currentTimeWIT,
                    dateFormatted: `${getIndonesianDayName()}, ${getIndonesianFormattedDate(todayDate)}`,
                    status: status
                });

                setDuplicateAlert(null);
                loadTodayAttendance();
                onDataUpdated();
            };

            return (
                <div className="space-y-6">
                    {}
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <StatCard label="TOTAL SISWA" value={scanStats.total} icon="fa-users" color="bg-slate-800 text-white" />
                        <StatCard label="SUDAH ABSEN" value={scanStats.scanned} icon="fa-check-circle" color="bg-blue-600 text-white" />
                        <StatCard label="HADIR TEPAT" value={scanStats.hadir} icon="fa-user-check" color="bg-emerald-600 text-white" />
                        <StatCard label="TERLAMBAT" value={scanStats.terlambat} icon="fa-user-clock" color="bg-amber-500 text-white" />
                        <StatCard label="BELUM ABSEN" value={scanStats.belum} icon="fa-user-times" color="bg-rose-600 text-white" />
                    </div>

                    {/* Hidden Autofocus Scanner Input */}
                    <form onSubmit={handleScanSubmit} className="relative">
                        <input
                            ref={inputRef}
                            type="text"
                            value={scanInput}
                            onChange={(e) => setScanInput(e.target.value)}
                            placeholder="Arahkan Scanner QR Code ke sini..."
                            className="w-full py-3 px-4 bg-white border-2 border-blue-500 rounded-xl font-mono text-sm shadow-sm focus:ring-4 focus:ring-blue-200 outline-none transition"
                            autoFocus
                        />
                        <span className="absolute right-3 top-3 text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-md font-bold animate-pulse">
                            <i className="fas fa-barcode mr-1"></i> SCANNER ACTIVE
                        </span>
                    </form>

                    {/* Duplicate / Alert Notice Box */}
                    {duplicateAlert && (
                        <div className={`p-5 rounded-2xl shadow-lg border-l-8 flex items-start space-x-4 animate-bounce ${
                            duplicateAlert.type === 'DUPLICATE' ? 'bg-amber-50 border-amber-500 text-amber-900' : 'bg-rose-50 border-rose-500 text-rose-900'
                        }`}>
                            <div className="text-3xl mt-1">
                                <i className={`fas ${duplicateAlert.type === 'DUPLICATE' ? 'fa-exclamation-triangle text-amber-600' : 'fa-times-circle text-rose-600'}`}></i>
                            </div>
                            <div className="flex-1">
                                <h3 className="font-extrabold text-base uppercase tracking-wider">{duplicateAlert.title}</h3>
                                {duplicateAlert.type === 'DUPLICATE' ? (
                                    <p className="text-sm mt-1">
                                        Siswa <strong>{duplicateAlert.studentName}</strong> ({duplicateAlert.class} - NISN: {duplicateAlert.nisn}) sudah melakukan scan pada jam <strong>{duplicateAlert.firstScanTime} WIT</strong> dengan status <strong>{duplicateAlert.status}</strong>.
                                    </p>
                                ) : (
                                    <p className="text-sm mt-1">{duplicateAlert.message}</p>
                                )}
                            </div>
                            <button onClick={() => setDuplicateAlert(null)} className="text-slate-400 hover:text-slate-700">
                                <i className="fas fa-times text-lg"></i>
                            </button>
                        </div>
                    )}

                    {}
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                        <div className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center">
                            <span className="text-xs font-bold uppercase tracking-widest text-blue-400">
                                <i className="fas fa-id-card mr-2"></i> HASIL SCAN SISWA TERAKHIR
                            </span>
                            <span className="text-xs font-mono text-slate-400">BATAS HADIR: {settings?.cutoffTime || '07:20'} WIT</span>
                        </div>

                        {lastScannedStudent ? (
                            <div className="p-8 grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
                                {/* Student Large Photo */}
                                <div className="flex flex-col items-center justify-center">
                                    <div className="w-56 h-72 bg-slate-100 rounded-2xl border-4 border-slate-200 shadow-inner overflow-hidden flex items-center justify-center relative">
                                        {lastScannedStudent.photoUrl ? (
                                            <img src={lastScannedStudent.photoUrl} alt={lastScannedStudent.name} className="w-full h-full object-cover" />
                                        ) : (
                                            <div className="text-center p-4 text-slate-400">
                                                <i className="fas fa-user-graduate text-8xl mb-2 text-slate-300"></i>
                                                <p className="text-xs font-semibold">FOTO SISWA</p>
                                            </div>
                                        )}
                                        <div className={`absolute bottom-0 left-0 right-0 py-2 text-center font-extrabold text-sm text-white uppercase ${
                                            lastScannedStudent.status === 'HADIR' ? 'bg-emerald-600' : 'bg-amber-600'
                                        }`}>
                                            {lastScannedStudent.status === 'HADIR' ? '✅ HADIR TEPAT WAKTU' : '⚠️ TERLAMBAT'}
                                        </div>
                                    </div>
                                </div>

                                {/* Student Detailed Metadata */}
                                <div className="md:col-span-2 space-y-4">
                                    <div className="border-b border-slate-200 pb-3">
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">NAMA LENGKAP SISWA</p>
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight">{lastScannedStudent.name}</h2>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 uppercase">NISN</p>
                                            <p className="text-xl font-extrabold text-slate-800 font-mono">{lastScannedStudent.nisn}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 uppercase">KELAS</p>
                                            <p className="text-xl font-extrabold text-blue-700">{lastScannedStudent.class}</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 pt-2">
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 uppercase">WAKTU SCAN</p>
                                            <p className="text-2xl font-black text-slate-900 font-mono">{lastScannedStudent.scanTime} WIT</p>
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 uppercase">TANGGAL</p>
                                            <p className="text-sm font-bold text-slate-700">{lastScannedStudent.dateFormatted}</p>
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-slate-100 flex items-center space-x-2 text-emerald-700 bg-emerald-50 p-3 rounded-xl border border-emerald-200">
                                        <i className="fas fa-check-circle text-lg"></i>
                                        <span className="text-xs font-bold">ABSENSI BERHASIL DICATAT DENGAN AMAN DI SYSTEM LOKAL</span>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="p-16 text-center text-slate-400 space-y-3">
                                <i className="fas fa-qrcode text-7xl text-slate-300 animate-pulse"></i>
                                <h3 className="text-lg font-bold text-slate-700">SIAP MELAKUKAN SCAN ABSENSI</h3>
                                <p className="text-xs max-w-md mx-auto text-slate-500">
                                    Silakan arahkan Kartu QR Code Siswa ke alat scanner eksternal. Hasil scan dan foto siswa akan langsung tampil di panel ini.
                                </p>
                            </div>
                        )}
                    </div>

                    {}
                    <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                        <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <h3 className="font-bold text-slate-800 text-sm">RIWAYAT SCAN HARI INI ({todayScans.length})</h3>
                            <span className="text-xs text-slate-500">Urut dari terbaru</span>
                        </div>
                        <div className="max-h-72 overflow-y-auto">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-600 font-bold uppercase tracking-wider border-b border-slate-200">
                                        <th className="p-3">WAKTU</th>
                                        <th className="p-3">NISN</th>
                                        <th className="p-3">NAMA SISWA</th>
                                        <th className="p-3">KELAS</th>
                                        <th className="p-3">STATUS</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {todayScans.length > 0 ? (
                                        todayScans.map((scan) => (
                                            <tr key={scan.id} className="hover:bg-slate-50">
                                                <td className="p-3 font-mono font-bold text-slate-700">{scan.scanTime} WIT</td>
                                                <td className="p-3 font-mono text-slate-600">{scan.nisn}</td>
                                                <td className="p-3 font-bold text-slate-800">{scan.studentName}</td>
                                                <td className="p-3 font-bold text-blue-600">{scan.class}</td>
                                                <td className="p-3">
                                                    <span className={`px-2 py-1 rounded-md text-[10px] font-extrabold ${
                                                        scan.status === 'HADIR' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                                    }`}>
                                                        {scan.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))
                                    ) : (
                                        <tr>
                                            <td colSpan="5" className="p-6 text-center text-slate-400">Belum ada siswa yang melakukan scan hari ini.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ label, value, icon, color }) {
            return (
                <div className={`${color} rounded-2xl p-4 shadow-md flex items-center justify-between`}>
                    <div>
                        <p className="text-[10px] font-bold uppercase tracking-wider opacity-80">{label}</p>
                        <h3 className="text-2xl font-black mt-1 font-mono">{value}</h3>
                    </div>
                    <div className="text-3xl opacity-30">
                        <i className={`fas ${icon}`}></i>
                    </div>
                </div>
            );
        }

                setStats({

                    todayAttended: attended,
                    hadir: hadir,
                    terlambat: terlambat,
                    percentage: pct

                            <p className="text-xs font-bold text-slate-400 uppercase">SUDAH ABSEN HARI INI</p>
                            <h2 className="text-3xl font-black text-blue-600 mt-2 font-mono">{stats.todayAttended}</h2>
                            <p className="text-xs text-slate-500 mt-2">Siswa terverifikasi</p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                            <p className="text-xs font-bold text-slate-400 uppercase">PERSENTASE KEHADIRAN</p>

                        <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200">

        function StudentManagementPage({ students, onDataUpdated }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [classFilter, setClassFilter] = useState('ALL');
            const [showModal, setShowModal] = useState(false);
            const [showBulkDeleteModal, setShowBulkDeleteModal] = useState(false);
            const [bulkConfirmText, setBulkConfirmText] = useState('');
            const [editingStudent, setEditingStudent] = useState(null);

            // Form Fields
            const [formData, setFormData] = useState({ nisn: '', name: '', class: '7A', parentPhone: '', photoUrl: '' });

            const classes = useMemo(() => {
                const unique = [...new Set(students.map(s => s.class))].sort();
                return unique.length > 0 ? unique : ['7A', '7B', '8A', '8B', '9A', '9B'];
            }, [students]);

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.nisn.includes(searchTerm);
                    const matchesClass = classFilter === 'ALL' || s.class === classFilter;
                    return matchesSearch && matchesClass;
                });
            }, [students, searchTerm, classFilter]);

            const handleOpenModal = (student = null) => {
                if (student) {
                    setEditingStudent(student);
                    setFormData({ nisn: student.nisn, name: student.name, class: student.class, parentPhone: student.parentPhone || '', photoUrl: student.photoUrl || '' });
                } else {
                    setEditingStudent(null);
                    setFormData({ nisn: '', name: '', class: classes[0] || '7A', parentPhone: '', photoUrl: '' });
                }
                setShowModal(true);
            };

            const handleSaveStudent = async (e) => {
                e.preventDefault();
                if (!formData.nisn || !formData.name || !formData.class) return;

                if (editingStudent) {
                    await db.students.update(editingStudent.id, formData);
                } else {
                    await db.students.add(formData);
                }

                setShowModal(false);
                onDataUpdated();
            };

            const handleDeleteStudent = async (id, name) => {
                if (window.confirm(`Apakah Anda yakin ingin menghapus siswa ${name}?`)) {
                    await db.students.delete(id);
                    onDataUpdated();
                }
            };

            const handleBulkDelete = async () => {
                if (bulkConfirmText === 'HAPUS SEMUA DATA SISWA') {
                    await db.students.clear();
                    setShowBulkDeleteModal(false);
                    setBulkConfirmText('');
                    onDataUpdated();
                }
            };

            // Download Template Excel
            const handleDownloadTemplate = () => {
                const templateData = [
                    { 'No': 1, 'Nama Siswa': 'Maria Alfonsina', 'NISN': '0058123456', 'Nomor HP Orang Tua': '081248001122', 'Kelas': '8B' },
                    { 'No': 2, 'Nama Siswa': 'Yohanes Wenda', 'NISN': '0058123457', 'Nomor HP Orang Tua': '081248001123', 'Kelas': '8B' }
                ];
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
                XLSX.writeFile(wb, "Template_Import_Siswa_SMPN6.xlsx");
            };

            // Import Excel Massal
            const handleImportExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsName = wb.SheetNames[0];
                    const ws = wb.Sheets[wsName];
                    const data = XLSX.utils.sheet_to_json(ws);

                    const newStudents = [];
                    for (let row of data) {
                        const nisn = String(row['NISN'] || '').trim();
                        const name = String(row['Nama Siswa'] || '').trim();
                        const sClass = String(row['Kelas'] || '').trim();
                        const phone = String(row['Nomor HP Orang Tua'] || '').trim();

                        if (nisn && name && sClass) {
                            newStudents.push({ nisn, name, class: sClass, parentPhone: phone, photoUrl: '' });
                        }
                    }

                    if (newStudents.length > 0) {
                        await db.students.bulkPut(newStudents);
                        onDataUpdated();
                    }
                };
                reader.readAsBinaryString(file);
            };

            // Upload Massal Foto Siswa
            const handleMassPhotoUpload = (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                Array.from(files).forEach(file => {
                    const fileName = file.name;
                    const nisn = fileName.substring(0, fileName.lastIndexOf('.'));

                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const base64Photo = evt.target.result;
                        const student = await db.students.where('nisn').equals(nisn).first();
                        if (student) {
                            await db.students.update(student.id, { photoUrl: base64Photo });
                            onDataUpdated();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            };

                                <h2 className="text-2xl font-black mt-1 font-mono">{queueItems.filter(i => i.status === 'SENT').length}</h2>
                            </div>
                            <div className="p-4 bg-rose-50 rounded-xl border border-rose-200 text-rose-900">
                                <p className="text-[10px] font-bold uppercase">GAGAL (FAILED)</p>
                                <h2 className="text-2xl font-black mt-1 font-mono">{queueItems.filter(i => i.status === 'FAILED').length}</h2>
                            </div>
                            <div className="p-4 bg-blue-50 rounded-xl border border-blue-200 text-blue-900">
                                <p className="text-[10px] font-bold uppercase">STATUS INTERNET</p>
                                <h2 className="text-sm font-bold mt-2">{isOnline ? '🟢 ONLINE' : '🔴 OFFLINE'}</h2>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="bg-slate-900 text-white font-bold uppercase text-[10px]">
                                        <th className="p-3">NISN</th>
                                        <th className="p-3">NAMA SISWA</th>
                                        <th className="p-3">NO. HP ORANG TUA</th>
                                        <th className="p-3">STATUS QUEUE</th>
                                        <th className="p-3">TEMPLATE ID</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y border">
                                    {queueItems.length > 0 ? (
                                        queueItems.map(q => (
                                            <tr key={q.id} className="hover:bg-slate-50">
                                                <td className="p-3 font-mono">{q.nisn}</td>
                                                <td className="p-3 font-bold text-slate-800">{q.studentName}</td>
                                                <td className="p-3 font-mono text-slate-600">{q.parentPhone}</td>
                                                <td className="p-3">
                                                    <span className={`px-2 py-0.5 rounded font-extrabold text-[10px] ${
                                                        q.status === 'SENT' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                                    }`}>
                                                        {q.status}
                                                    </span>
                                                </td>
                                                <td className="p-3 font-mono text-blue-600">{q.templateId}</td>

                                        <tr>
                                            <td colSpan="5" className="p-6 text-center text-slate-400">Antrean WhatsApp kosong.</td>

            );
        }

        function UserGuidePage() {
            return (
                <div className="bg-white p-8 rounded-2xl shadow-md border border-slate-200 space-y-6 max-w-4xl mx-auto">
                    <div className="border-b pb-4">
                        <h2 className="text-lg font-black text-slate-900 uppercase">📖 PANDUAN PENGGUNAAN APLIKASI ABSENSI SISWA</h2>
                        <p className="text-xs text-blue-700 font-bold">SMP NEGERI 6 MANOKWARI</p>
                    </div>

                    <div className="space-y-4 text-xs leading-relaxed text-slate-700">
                        <section className="bg-slate-50 p-4 rounded-xl border">
                            <h3 className="font-bold text-slate-900 text-sm mb-2">1. LOGIN PROKTOR</h3>
                            <p>Gunakan Username: <strong>proktorsmp6</strong> dan Password: <strong>60400173</strong>. Sesi login akan tersimpan otomatis di browser tanpa logout saat koneksi mati.</p>
                        </section>

                        <section className="bg-slate-50 p-4 rounded-xl border">
                            <h3 className="font-bold text-slate-900 text-sm mb-2">2. CARA MELAKUKAN SCAN QR CODE</h3>
                            <p>Buka menu <strong>Scan Hari Ini</strong>. Colokkan alat Barcode Scanner QR ke komputer. Arahkan QR Code siswa. Sistem akan otomatis mendeteksi NISN, memvalidasi anti-duplikasi, menyimpan absensi, dan menampilkan foto siswa secara besar.</p>
                        </section>

                        <section className="bg-slate-50 p-4 rounded-xl border">
                            <h3 className="font-bold text-slate-900 text-sm mb-2">3. PENANGANAN SCAN DUPLIKAT</h3>
                            <p>Jika siswa yang sama melakukan scan dua kali pada hari yang sama, sistem akan menolak scan kedua dan menampilkan panel peringatan <strong>⚠️ SCAN DUPLIKAT</strong> tanpa membuat rekaman ganda.</p>
                        </section>

                        <section className="bg-slate-50 p-4 rounded-xl border">
                            <h3 className="font-bold text-slate-900 text-sm mb-2">4. UPLOAD FOTO MASSAL SISWA</h3>
                            <p>Buka menu <strong>Data Siswa</strong> &rarr; Klik <strong>Upload Foto Massal</strong>. Pilih foto yang diberi nama sesuai NISN (contoh: <code>0058123456.jpg</code>). Foto akan dihubungkan secara otomatis dengan data siswa.</p>
                        </section>

                        <section className="bg-slate-50 p-4 rounded-xl border">
                            <h3 className="font-bold text-slate-900 text-sm mb-2">5. BACKUP & RESTORE DATABASE</h3>
                            <p>Buka menu <strong>Pengaturan</strong> &rarr; Pilih <strong>Export Backup JSON</strong> untuk mengamankan data lokal Anda ke dalam file backup komputer.</p>
                        </section>
                    </div>
                </div>
            );
        }

        function SettingsPage({ settings, onDataUpdated }) {
            const [cutoffTime, setCutoffTime] = useState(settings?.cutoffTime || '07:20');

            const handleSaveSettings = async (e) => {
                e.preventDefault();
                await db.settings.put({
                    id: 'app_config',
                    ...settings,
                    cutoffTime: cutoffTime
                });
                onDataUpdated();
                alert('Pengaturan jam hadir berhasil disimpan!');
            };

            const handleExportBackup = async () => {
                const allStudents = await db.students.toArray();
                const allAttendance = await db.attendance.toArray();
                const allSettings = await db.settings.toArray();

                const backupData = {
                    version: 1,
                    school: 'SMP NEGERI 6 MANOKWARI',
                    timestamp: new Date().toISOString(),
                    students: allStudents,
                    attendance: allAttendance,
                    settings: allSettings
                };

                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_Absensi_SMPN6_${getFormattedDate()}.json`;
                a.click();
            };

            const handleRestoreBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (data.students) {
                            await db.students.clear();
                            await db.students.bulkAdd(data.students);
                        }
                        if (data.attendance) {
                            await db.attendance.clear();
                            await db.attendance.bulkAdd(data.attendance);
                        }
                        onDataUpdated();
                        alert('Restore database lokal berhasil dikembalikan!');
                    } catch (err) {
                        alert('Format file JSON backup tidak valid.');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="bg-white p-8 rounded-2xl shadow-md border border-slate-200 max-w-2xl mx-auto space-y-6">
                    <h3 className="font-extrabold text-slate-900 text-base border-b pb-3">⚙️ PENGATURAN SISTEM LOKAL</h3>

                    <form onSubmit={handleSaveSettings} className="space-y-4">
                        <div>
                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">BATAS JAM TEPAT WAKTU (WIT)</label>
                            <input 
                                type="time" 
                                value={cutoffTime} 
                                onChange={(e) => setCutoffTime(e.target.value)}
                                className="px-3 py-2 border rounded-lg text-xs font-mono font-bold"
                            />
                            <p className="text-[11px] text-slate-500 mt-1">Scan sebelum waktu ini dicatat HADIR. Setelah waktu ini dicatat TERLAMBAT.</p>
                        </div>
                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg">SIMPAN PENGATURAN</button>
                    </form>

                    <div className="pt-6 border-t space-y-3">
                        <h4 className="font-bold text-xs text-slate-800 uppercase">BACKUP & RESTORE DATABASE LOKAL INDEXEDDB</h4>
                        <div className="flex space-x-3">
                            <button onClick={handleExportBackup} className="px-4 py-2 bg-slate-800 text-white text-xs font-bold rounded-lg">
                                <i className="fas fa-download mr-1"></i> Export Backup JSON
                            </button>
                            <label className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg cursor-pointer">
                                <i className="fas fa-upload mr-1"></i> Restore Import JSON
                                <input type="file" accept=".json" onChange={handleRestoreBackup} className="hidden" />
                            </label>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
