    // Audio Context Setup for Beeps
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type = 'success') {
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'late') {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else { // error
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch (e) {
        console.log("Audio feedback disabled or restricted");
      }
    }

    // Date & WIT Timezone Helper Functions
    function getWITDateObject() {
      // Computes current date/time adjusted to Jayapura / WIT (UTC+9)
      const now = new Date();
      const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utcMs + (3600000 * 9));
    }

    function getTodayDateStringString() {
      const d = getWITDateObject();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatWITTime(dateObj = getWITDateObject()) {
      const hh = String(dateObj.getHours()).padStart(2, '0');
      const mm = String(dateObj.getMinutes()).padStart(2, '0');
      const ss = String(dateObj.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function formatIndonesianDate(dateStr) {
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return d.toLocaleDateString('id-ID', options);
    }

    // Cutoff Check: 07:20 WIT
    function determineAttendanceStatus(witDate) {
      const hours = witDate.getHours();
      const minutes = witDate.getMinutes();
      // 7:20 -> 7 * 60 + 20 = 440 minutes from midnight
      const currentMinutes = hours * 60 + minutes;
      if (currentMinutes <= 440) {
        return 'HADIR';
      } else {
        return 'TERLAMBAT';
      }
    }

    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto p-4 rounded-2xl shadow-2xl glass-card flex items-start gap-3 transform transition-all duration-300 translate-x-10 opacity-0 border-l-4 ${
        type === 'success' ? 'border-emerald-500 bg-slate-900/90' :
        type === 'error' ? 'border-rose-500 bg-slate-900/90' :
        type === 'warning' ? 'border-amber-500 bg-slate-900/90' :
        'border-blue-500 bg-slate-900/90'
      }`;

      const icon = type === 'success' ? 'fa-circle-check text-emerald-400' :
                 type === 'error' ? 'fa-triangle-exclamation text-rose-400' :
                 type === 'warning' ? 'fa-circle-exclamation text-amber-400' :
                 'fa-circle-info text-blue-400';

      toast.innerHTML = `
        <i class="fa-solid ${icon} text-xl mt-0.5"></i>
        <div class="flex-1">
          <h4 class="font-bold text-sm text-slate-100">${title}</h4>
          <p class="text-xs text-slate-300 mt-0.5">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-x-10', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('translate-x-10', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    async function initializeDashboardData() {
      if (!currentUser) return;

      // 1. Listen to Students Database
      const studentsRef = collection(db, "students");
      onSnapshot(studentsRef, (snapshot) => {
        studentsMap.clear();
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          studentsMap.set(data.nisn, { id: docSnap.id, ...data });
        });
        updateDashboardKPIs();
        if (currentView === 'students') renderStudentsTable();
      }, (error) => {
        console.error("Error loading students:", error);
      });

      // 2. Listen to Today's Attendance
      const today = getTodayDateStringString();
      const attendanceRef = collection(db, "attendance");
      const qToday = query(attendanceRef, where("date", "==", today));
      
      onSnapshot(qToday, (snapshot) => {
        todayAttendance = [];
        snapshot.forEach((docSnap) => {
          todayAttendance.push({ id: docSnap.id, ...docSnap.data() });
        });
        // Sort descending by scan timestamp
        todayAttendance.sort((a, b) => b.timestamp - a.timestamp);
        
        if (todayAttendance.length > 0 && (!lastScannedStudent || lastScannedStudent.scanId !== todayAttendance[0].id)) {
          const latest = todayAttendance[0];
          lastScannedStudent = {
            scanId: latest.id,
            nisn: latest.nisn,
            name: latest.studentName,
            class: latest.studentClass,
            photoUrl: latest.photoUrl || `https://placehold.co/400x400/1e293b/94a3b8?text=${encodeURIComponent(latest.studentName)}`,
            time: latest.time,
            date: latest.date,
            status: latest.status
          };
        }

        updateDashboardKPIs();
        if (currentView === 'scan') renderScanViewContent();
        if (currentView === 'recap') renderRecapContent();
      }, (error) => {
        console.error("Error loading today attendance:", error);
      });

      // 3. Start WhatsApp Queue Processor
      startWhatsAppQueueEngine();
    }

    async function handleGoogleLogin() {

        provider.setCustomParameters({ prompt: 'select_account' });
        
        // Use popup for standard desktop browsers
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        if (user.email !== ALLOWED_PROKTOR_EMAIL) {

          await signOut(auth);
          return;
        }

      } catch (error) {
        console.error("Login Error:", error);
        if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user') {
          showToast("Popup Terblokir", "Mencoba metode pengalihan...", "warning");
          signInWithRedirect(auth, new GoogleAuthProvider());
        } else if (error.code === 'auth/api-key-not-valid-please-pass-a-valid-api-key.') {
          showToast("Konfigurasi Error", "API Key Firebase tidak valid. Mohon periksa kembali Firebase Console.", "error");
        } else {
          showToast("Gagal Login", error.message, "error");
        }
      }
    }

    let scanBuffer = '';
    let scanTimeout = null;

    function setupGlobalQRScanner() {
      window.addEventListener('keydown', (e) => {
        // Ignore keydowns inside standard form inputs
        const tag = document.activeElement ? document.activeElement.tagName.toUpperCase() : '';
        if (tag === 'INPUT' && document.activeElement.id !== 'qr-hidden-input') return;
        if (tag === 'TEXTAREA' || tag === 'SELECT') return;

        if (e.key === 'Enter') {
          if (scanBuffer.trim().length > 0) {
            processQRScan(scanBuffer.trim());
            scanBuffer = '';
          }
        } else if (e.key.length === 1) {
          scanBuffer += e.key;
          clearTimeout(scanTimeout);
          scanTimeout = setTimeout(() => {
            scanBuffer = '';
          }, 300); // 300ms barcode scanner buffer timeout
        }
      });
    }

    async function processQRScan(rawNisn) {
      const nisn = rawNisn.trim();
      if (!nisn) return;

      const today = getTodayDateStringString();
      const witTime = getWITDateObject();
      const timeStr = formatWITTime(witTime);
      const status = determineAttendanceStatus(witTime);
      const docId = `${today}_${nisn}`;

      // 1. Anti-Duplication Check: Local Memory + Firestore
      const existsLocal = todayAttendance.some(a => a.nisn === nisn);
      if (existsLocal) {
        playBeep('error');
        showToast("Scan Ditolak", `NISN ${nisn} sudah tercatat melakukan absensi hari ini.`, "warning");
        return;
      }

      // 2. Lookup Student in Database
      const student = studentsMap.get(nisn);
      if (!student) {
        playBeep('error');
        showToast("Siswa Tidak Ditemukan", `NISN ${nisn} belum terdaftar pada Master Data Siswa.`, "error");
        return;
      }

      // Play Feedback Beep
      playBeep(status === 'HADIR' ? 'success' : 'late');

      // Construct Attendance Record
      const attendanceData = {
        docId: docId,
        date: today,
        nisn: student.nisn,
        studentName: student.name,
        studentClass: student.class,
        parentPhone: student.parentPhone || '',
        photoUrl: student.photoUrl || '',
        time: timeStr,
        timestamp: Date.now(),
        status: status
      };

      // Update Last Scanned View State Instantly
      lastScannedStudent = {
        scanId: docId,
        nisn: student.nisn,
        name: student.name,
        class: student.class,
        photoUrl: student.photoUrl || `https://placehold.co/400x400/1e293b/ffffff?text=${encodeURIComponent(student.name)}`,
        time: timeStr,
        date: today,
        status: status
      };

      if (currentView === 'scan') renderScanViewContent();

      // 3. Save to Firestore Async (Non-blocking)
      try {
        const attRef = doc(db, "attendance", docId);
        await setDoc(attRef, attendanceData);
        showToast("Absensi Saved", `${student.name} (${status})`, "success");

        // 4. Push Notification to WhatsApp Queue
        enqueueWhatsAppNotification(attendanceData);

      } catch (err) {
        console.error("Firestore Save Error:", err);
        showToast("Error Database", "Gagal menyimpan data absensi ke cloud.", "error");
      }
    }

    function getRandomWATemplate(item) {
      const idx = Math.floor(Math.random() * WA_TEMPLATES.length);
      return WA_TEMPLATES[idx](item);
    }

    function enqueueWhatsAppNotification(attItem) {
      if (!attItem.parentPhone) return;

      const queueItem = {
        id: `WA_${Date.now()}_${attItem.nisn}`,
        nisn: attItem.nisn,
        studentName: attItem.studentName,
        parentPhone: attItem.parentPhone,
        message: getRandomWATemplate(attItem),
        status: 'QUEUED', // QUEUED, PROCESSING, SENT, FAILED
        createdAt: Date.now()
      };

      waQueue.push(queueItem);
      updateDashboardKPIs();
    }

    function startWhatsAppQueueEngine() {
      if (waTimerInterval) clearInterval(waTimerInterval);

      waTimerInterval = setInterval(async () => {
        // Handle Countdown Pause
        if (waQueueStatus.paused) {
          waQueueStatus.countdown--;
          if (waQueueStatus.countdown <= 0) {
            waQueueStatus.paused = false;
            waQueueStatus.currentBatchCount = 0;
            showToast("Queue WA Resumed", "Melanjutkan pengiriman antrean WhatsApp batch berikutnya.", "info");
          }
          if (currentView === 'whatsapp' || currentView === 'dashboard') updateDashboardKPIs();
          return;
        }

        // Check for queued messages
        const nextItem = waQueue.find(q => q.status === 'QUEUED');
        if (!nextItem) return;

        // Process single item
        nextItem.status = 'PROCESSING';
        waQueueStatus.currentBatchCount++;

        try {
          // Send request to WhatsApp Endpoint
          const payload = {
            api_key: waConfig.apiKey,
            receiver: nextItem.parentPhone,
            data: { message: nextItem.message }
          };

          /* Simulating HTTP POST Call to WhatsApp API Adapter */
          // const res = await fetch(waConfig.endpointUrl, { method: 'POST', body: JSON.stringify(payload) });
          
          // Simulation delay
          await new Promise(r => setTimeout(r, 1000));
          
          nextItem.status = 'SENT';
          nextItem.sentAt = formatWITTime();

        } catch (err) {
          console.error("WA Send Error:", err);
          nextItem.status = 'FAILED';
        }

        // Check if Batch of 5 completed
        if (waQueueStatus.currentBatchCount >= 5) {
          waQueueStatus.paused = true;
          waQueueStatus.countdown = 300; // 5 minutes = 300 seconds
          showToast("WA Queue Paused", "Batch 5 pesan selesai. Antrean diistirahatkan selama 5 menit.", "warning");
        }

        updateDashboardKPIs();
      }, 3000);
    }

    window.handleExcelImport = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const workbook = XLSX.read(evt.target.result, { type: 'binary' });
          const firstSheet = workbook.SheetNames[0];
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

          let success = 0;
          const batch = writeBatch(db);

          rows.forEach((row) => {
            const nisn = String(row['NISN'] || row['nisn'] || '').trim();
            const name = String(row['Nama Siswa'] || row['nama'] || '').trim();
            const studentClass = String(row['Kelas'] || row['kelas'] || '').trim();
            const phone = String(row['Nomor HP Orang Tua'] || row['hp'] || '').trim();

            if (nisn && name) {
              const docRef = doc(db, "students", nisn);
              batch.set(docRef, {
                nisn: nisn,
                name: name,
                class: studentClass || '7A',
                parentPhone: phone,
                updatedAt: serverTimestamp()
              }, { merge: true });
              success++;
            }
          });

          await batch.commit();
          showToast("Import Berhasil", `${success} data siswa berhasil diimport ke database.`, "success");
        } catch (err) {
          console.error("Excel import error:", err);
          showToast("Gagal Import", "Format file Excel tidak sesuai.", "error");
        }
      };
      reader.readAsBinaryString(file);
    };

    window.handleMassPhotoUpload = async function(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      showToast("Uploading Foto", `Memproses upload ${files.length} foto siswa...`, "info");
      let count = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        // Extract NISN from file name (e.g. 0051234567.jpg)
        const nisn = file.name.split('.')[0].trim();
        
        if (studentsMap.has(nisn)) {
          try {
            const storageRef = ref(storage, `students_photos/${nisn}.jpg`);
            await uploadBytes(storageRef, file);
            const downloadUrl = await getDownloadURL(storageRef);

            // Sync URL to student doc
            const studentRef = doc(db, "students", nisn);
            await updateDoc(studentRef, { photoUrl: downloadUrl });
            count++;
          } catch (err) {
            console.error(`Error uploading photo for ${nisn}:`, err);
          }
        }
      }

      showToast("Upload Selesai", `${count} foto berhasil dihubungkan dengan NISN siswa.`, "success");
