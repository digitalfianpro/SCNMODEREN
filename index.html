            ];
            const terlambatOpeners = [
                "Kami menginformasikan bahwa ananda [NAMA] (Kelas [KELAS]) tercatat hadir TERLAMBAT di sekolah.",

                "Semoga ke depannya ananda semakin disiplin dan tepat waktu."
            ];

            let countTerlambat = 1;
            for (let g of terlambatGreetings) {
                for (let o of terlambatOpeners) {
                    for (let c of terlambatClosers) {
                        if (countTerlambat <= 100) {
                            templates.push({
                                id: `TERLAMBAT-${String(countTerlambat).padStart(3, '0')}`,

                            });

        };

        const SYSTEM_TEMPLATES = generate200Templates();

        const getFormattedDate = (d = new Date()) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getFormattedTimeWIT = (d = new Date()) => {
            const options = { timeZone: 'Asia/Jayapura', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            return new Intl.DateTimeFormat('id-ID', options).format(d).replace(/\./g, ':');
        };

        const getIndonesianDayName = (d = new Date()) => {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            return days[d.getDay()];
        };

        const getIndonesianFormattedDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        };

        const initDefaultData = async () => {
            const settingsCount = await db.settings.count();
            if (settingsCount === 0) {
                await db.settings.put({
                    id: 'app_config',
                    schoolName: 'SMP NEGERI 6 MANOKWARI',
                    cutoffTime: '07:20',
                    timezone: 'Asia/Jayapura',
                    whatsappApiKey: 'JS3EZBCY67FH36ygwLgE',
                    batchSize: 5,
                    pauseMinutes: 5
                });
            }

            const studentCount = await db.students.count();
            if (studentCount === 0) {
                const sampleStudents = [
                    { nisn: '0058123456', name: 'Maria Alfonsina', class: '8B', parentPhone: '081248001122', photoUrl: '' },
                    { nisn: '0058123457', name: 'Yohanes Wenda', class: '8B', parentPhone: '081248001123', photoUrl: '' },
                    { nisn: '0058123458', name: 'Budi Santoso', class: '8A', parentPhone: '081248001124', photoUrl: '' },
                    { nisn: '0058123459', name: 'Agustina Rumbewas', class: '7A', parentPhone: '081248001125', photoUrl: '' },
                    { nisn: '0058123460', name: 'Kornelis Mandacan', class: '9A', parentPhone: '081248001126', photoUrl: '' },
                    { nisn: '0058123461', name: 'Siti Aminah', class: '7B', parentPhone: '081248001127', photoUrl: '' },
                    { nisn: '0058123462', name: 'Daniel Tabuni', class: '9B', parentPhone: '081248001128', photoUrl: '' }
                ];
                await db.students.bulkAdd(sampleStudents);
            }
        };

        const { useState, useEffect, useRef, useMemo } = React;

        // --- MAIN APPLICATION COMPONENT ---
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(() => {
                return localStorage.getItem('smpn6_proctor_session') === 'active';
            });
            const [currentTab, setCurrentTab] = useState('scan');
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [settings, setSettings] = useState(null);
            const [students, setStudents] = useState([]);
            const [lastScannedStudent, setLastScannedStudent] = useState(null);
            const [duplicateAlert, setDuplicateAlert] = useState(null);
            const [waQueueCount, setWaQueueCount] = useState(0);

            // Custom Dialog Modal State (Replaces alert & confirm)
            const [modalDialog, setModalDialog] = useState(null);

            // WhatsApp Dispatch Engine State (5 msgs sent -> 5 mins pause rule)
            const [waDispatchState, setWaDispatchState] = useState({
                isSending: false,
                isPaused: false,
                pauseCountdown: 0,
                consecutiveSent: 0,
                lastStatusMsg: 'Antrean Pesan Siap'
            });

            const pauseTimerRef = useRef(null);

            useEffect(() => {
                initDefaultData().then(() => {
                    loadAppData();
                });

                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    if (pauseTimerRef.current) clearInterval(pauseTimerRef.current);
                };
            }, []);

            const loadAppData = async () => {
                const config = await db.settings.get('app_config');
                setSettings(config || {});
                const studentList = await db.students.toArray();
                setStudents(studentList);
                
                const pendingWa = await db.whatsappQueue.where('status').equals('QUEUED').count();
                setWaQueueCount(pendingWa);
            };

            // --- AUTOMATED WHATSAPP QUEUE DISPATCHER WITH 5-MSG / 5-MIN PAUSE RULE ---
            useEffect(() => {
                let isCancelled = false;

                const processQueueBatch = async () => {
                    if (waDispatchState.isPaused || !isOnline) return;

                    const pendingItems = await db.whatsappQueue
                        .where('status')
                        .equals('QUEUED')
                        .sortBy('scheduledAt');

                    if (pendingItems.length === 0) return;

                    // Check if 5 consecutive messages have been sent in this batch
                    if (waDispatchState.consecutiveSent >= 5) {
                        // START 5-MINUTE PAUSE (300 SECONDS)
                        setWaDispatchState(prev => ({
                            ...prev,
                            isPaused: true,
                            pauseCountdown: 300,
                            lastStatusMsg: '⏸️ Telah mengirim 5 pesan. Sistem istirahat 5 menit untuk proteksi API.'
                        }));

                        if (pauseTimerRef.current) clearInterval(pauseTimerRef.current);

                        pauseTimerRef.current = setInterval(() => {
                            setWaDispatchState(prev => {
                                if (prev.pauseCountdown <= 1) {
                                    clearInterval(pauseTimerRef.current);
                                    return {
                                        ...prev,
                                        isPaused: false,
                                        pauseCountdown: 0,
                                        consecutiveSent: 0,
                                        lastStatusMsg: '▶️ Jeda 5 menit selesai. Melanjutkan pengiriman antrean WA...'
                                    };
                                }
                                return {
                                    ...prev,
                                    pauseCountdown: prev.pauseCountdown - 1
                                };
                            });
                        }, 1000);

                        return;
                    }

                    // Process Next Message in Queue
                    const item = pendingItems[0];
                    setWaDispatchState(prev => ({ ...prev, isSending: true, lastStatusMsg: `Mengirim WA ke ${item.studentName}...` }));

                    try {
                        // Simulated API Call using JS3EZBCY67FH36ygwLgE
                        await new Promise(resolve => setTimeout(resolve, 1200));

                        // Mark item as SENT
                        await db.whatsappQueue.update(item.id, {
                            status: 'SENT',
                            sentAt: new Date().toISOString()
                        });

                        // Record Log
                        await db.whatsappLogs.add({
                            queueId: item.id,
                            nisn: item.nisn,
                            parentPhone: item.parentPhone,
                            sentAt: new Date().toISOString(),
                            status: 'SUCCESS',
                            templateId: item.templateId
                        });

                        if (!isCancelled) {
                            setWaDispatchState(prev => ({
                                ...prev,
                                isSending: false,
                                consecutiveSent: prev.consecutiveSent + 1,
                                lastStatusMsg: `✅ Pesan ke ${item.studentName} terkirim!`
                            }));
                            loadAppData();
                        }
                    } catch (err) {
                        await db.whatsappQueue.update(item.id, { status: 'FAILED' });
                        if (!isCancelled) {
                            setWaDispatchState(prev => ({ ...prev, isSending: false, lastStatusMsg: '❌ Gagal mengirim pesan.' }));
                        }
                    }
                };

                const interval = setInterval(processQueueBatch, 3000);
                return () => {
                    isCancelled = true;
                    clearInterval(interval);
                };
            }, [waDispatchState, isOnline, settings]);

            const handleLogin = (user, pass) => {
                if (user === AUTH_CONFIG.username && pass === AUTH_CONFIG.password) {
                    localStorage.setItem('smpn6_proctor_session', 'active');
                    setIsLoggedIn(true);
                    return true;
                }
                return false;
            };

                localStorage.removeItem('smpn6_proctor_session');
                setIsLoggedIn(false);
            };

                return <LoginScreen onLogin={handleLogin} />;
            }

            return (

                                    <div className="relative w-14 h-14 bg-white rounded-2xl p-1.5 shadow-md border border-slate-100 flex items-center justify-center">
                                        <img 
                                            src={AUTH_CONFIG.logoUrl} 
                                            alt="Logo SMPN 6 Manokwari" 
                                            className="w-full h-full object-contain" 
                                            onError={(e) => { e.target.src = 'https://placehold.co/120x120/0284c7/ffffff?text=SMPN6'; }}
                                        />
                                    </div>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-sm tracking-tight text-slate-900 leading-tight">ABSENSI DIGITAL</h1>
                                    <p className="text-xs font-bold text-sky-600 tracking-wider mt-0.5">SMPN 6 MANOKWARI</p>
                                    <span className="inline-block mt-1 px-2 py-0.5 bg-sky-100 text-sky-800 rounded-md text-[10px] font-black uppercase tracking-wider">
                                        PROKTOR PANEL
                                    </span>
                                </div>
                            </div>

                            {/* Sidebar Menu Nav */}
                            <nav className="p-4 space-y-1.5">
                                <NavItem icon="fa-qrcode" label="Scan Hari Ini" active={currentTab === 'scan'} onClick={() => setCurrentTab('scan')} badge="UTAMA" />
                                <NavItem icon="fa-chart-pie" label="Dashboard Utama" active={currentTab === 'dashboard'} onClick={() => setCurrentTab('dashboard')} />
                                <NavItem icon="fa-users" label="Data Siswa" active={currentTab === 'students'} onClick={() => setCurrentTab('students')} badge={students.length} />
                                <NavItem icon="fa-calendar-day" label="Rekap Harian" active={currentTab === 'rekap-harian'} onClick={() => setCurrentTab('rekap-harian')} />
                                <NavItem icon="fa-calendar-week" label="Rekap Mingguan" active={currentTab === 'rekap-mingguan'} onClick={() => setCurrentTab('rekap-mingguan')} />

                                <NavItem icon="fa-paper-plane" label="Queue WhatsApp" active={currentTab === 'whatsapp'} onClick={() => setCurrentTab('whatsapp')} badge={waQueueCount > 0 ? waQueueCount : null} badgeColor="bg-amber-500" />
                                <NavItem icon="fa-book-open" label="Panduan Lengkap" active={currentTab === 'guide'} onClick={() => setCurrentTab('guide')} />
                                <NavItem icon="fa-cog" label="Pengaturan Sistem" active={currentTab === 'settings'} onClick={() => setCurrentTab('settings')} />
                            </nav>
                        </div>

                        {/* User Profile & Logout */}
                        <div className="p-4 border-t border-slate-100 bg-slate-50/50">

                                <div className="w-9 h-9 rounded-lg bg-sky-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-sky-200">
                                    PRO
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">STATUS AKSES</p>
                                    <p className="text-xs font-bold text-slate-800 truncate">{AUTH_CONFIG.username}</p>
                                </div>
                            </div>
                            <button 
                                onClick={handleLogout}
                                className="w-full py-2.5 px-3 bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white rounded-xl text-xs font-bold flex items-center justify-center transition-all duration-200 shadow-sm"
                            >
                                <i className="fas fa-sign-out-alt mr-2"></i> Logout Aplikasi
                            </button>
                        </div>
                    </aside>

                    {}
                    {/* Main Work Area */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-white">
                        {/* Header Navbar */}
                        <header className="h-20 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-8 z-10 no-print">
                            <div className="flex items-center space-x-3">
                                <span className="p-2 bg-sky-50 text-sky-600 rounded-xl text-lg font-bold border border-sky-100">
                                    <i className={`fas ${
                                        currentTab === 'scan' ? 'fa-qrcode' :
                                        currentTab === 'dashboard' ? 'fa-chart-pie' :
                                        currentTab === 'students' ? 'fa-users' :
                                        currentTab === 'whatsapp' ? 'fa-paper-plane' :
                                        currentTab === 'guide' ? 'fa-book-open' : 'fa-cog'
                                    }`}></i>
                                </span>
                                <div>
                                    <h2 className="text-base font-extrabold text-slate-900 uppercase tracking-tight">
                                        {currentTab === 'scan' && 'Scanner QR Absensi Siswa'}
                                        {currentTab === 'dashboard' && 'Dashboard Monitoring Realtime'}
                                        {currentTab === 'students' && 'Manajemen Master Data Siswa'}
                                        {currentTab === 'rekap-harian' && 'Rekapitulasi Absensi Harian'}
                                        {currentTab === 'rekap-mingguan' && 'Rekapitulasi Absensi Mingguan'}
                                        {currentTab === 'rekap-bulanan' && 'Rekapitulasi Absensi Bulanan'}
                                        {currentTab === 'whatsapp' && 'Antrean Monitoring WhatsApp'}
                                        {currentTab === 'guide' && 'Panduan Penggunaan Aplikasi'}
                                        {currentTab === 'settings' && 'Pengaturan Sistem & Database'}
                                    </h2>
                                    <p className="text-[11px] text-slate-500 font-medium">SMP NEGERI 6 MANOKWARI • PAPUA BARAT</p>
                                </div>
                            </div>

                            {/* Network & Live Clock Badge */}
                            <div className="flex items-center space-x-4">
                                <div className={`flex items-center px-3.5 py-1.5 rounded-full text-xs font-bold border shadow-sm transition-all ${
                                    isOnline 
                                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                        : 'bg-rose-50 text-rose-700 border-rose-200'

                                    <span className={`w-2 h-2 rounded-full mr-2 ${isOnline ? 'bg-emerald-500 animate-ping' : 'bg-rose-500'}`}></span>

                                                Batal
                                            </button>
                                            <button

        // --- SCAN PAGE COMPONENT WITH LARGE PHOTO DISPLAY & DETAILED RESULT ---
        function ScanPage({ settings, students, lastScannedStudent, setLastScannedStudent, duplicateAlert, setDuplicateAlert, onDataUpdated }) {
            const [scanInput, setScanInput] = useState('');
            const [todayScans, setTodayScans] = useState([]);
            const [scanStats, setScanStats] = useState({ total: 0, scanned: 0, hadir: 0, terlambat: 0, belum: 0 });
            const inputRef = useRef(null);

            const todayDate = getFormattedDate();

            useEffect(() => {
                const interval = setInterval(() => {
                    if (inputRef.current && document.activeElement !== inputRef.current) {
                        inputRef.current.focus();
                    }
                }, 1000);
                loadTodayAttendance();
                return () => clearInterval(interval);
            }, [students]);

            const loadTodayAttendance = async () => {
                const records = await db.attendance.where('date').equals(todayDate).reverse().sortBy('timestamp');
                setTodayScans(records);

                const scannedCount = records.length;
                const hadirCount = records.filter(r => r.status === 'HADIR').length;
                const terlambatCount = records.filter(r => r.status === 'TERLAMBAT').length;
                const totalStudents = students.length;

                setScanStats({
                    total: totalStudents,
                    scanned: scannedCount,
                    hadir: hadirCount,
                    terlambat: terlambatCount,
                    belum: Math.max(0, totalStudents - scannedCount)
                });
            };

            const handleScanSubmit = async (e) => {
                e.preventDefault();
                const cleanNisn = scanInput.trim();
                setScanInput('');

                if (!cleanNisn) return;

                const student = students.find(s => s.nisn === cleanNisn);

                if (!student) {
                    setDuplicateAlert({
                        type: 'NOT_FOUND',
                        title: '⚠️ SISWA TIDAK DITEMUKAN',
                        nisn: cleanNisn,
                        message: `Data siswa dengan NISN "${cleanNisn}" belum terdaftar dalam database sekolah.`
                    });
                    return;
                }

                const attendanceId = `${todayDate}_${cleanNisn}`;
                const existingAttendance = await db.attendance.get(attendanceId);

                if (existingAttendance) {
                    setDuplicateAlert({
                        type: 'DUPLICATE',
                        title: '⚠️ ABSENSI DUPLIKAT DITOLAK',
                        studentName: student.name,
                        nisn: student.nisn,
                        class: student.class,
                        firstScanTime: existingAttendance.scanTime,
                        status: existingAttendance.status,
                        message: 'Siswa ini sudah melakukan scan absensi hari ini. Presensi ulang ditolak oleh sistem.'
                    });
                    return;
                }

                const currentTimeWIT = getFormattedTimeWIT();
                const cutoff = settings?.cutoffTime || '07:20';
                
                const isLate = currentTimeWIT.substring(0, 5) > cutoff;
                const status = isLate ? 'TERLAMBAT' : 'HADIR';
                const note = isLate 
                    ? `Terlambat melakukan scan setelah jam batas ${cutoff} WIT.` 
                    : `Hadir tepat waktu sebelum jam batas ${cutoff} WIT.`;

                const newAttendance = {
                    id: attendanceId,
                    date: todayDate,
                    nisn: student.nisn,
                    studentId: student.id,
                    studentName: student.name,
                    class: student.class,
                    status: status,
                    scanTime: currentTimeWIT,
                    timestamp: Date.now()
                };

                await db.attendance.put(newAttendance);

                // Queue WhatsApp Parent Message with Random Dynamic Template
                const activeTemplates = SYSTEM_TEMPLATES.filter(t => t.type === status);
                const randomTemplate = activeTemplates[Math.floor(Math.random() * activeTemplates.length)];

                let waMessage = randomTemplate.content
                    .replace(/\[NAMA\]/g, student.name)
                    .replace(/\[KELAS\]/g, student.class)
                    .replace(/\[TANGGAL\]/g, getIndonesianFormattedDate(todayDate))
                    .replace(/\[HARI\]/g, getIndonesianDayName())
                    .replace(/\[JAM\]/g, currentTimeWIT)
                    .replace(/\[KETERANGAN\]/g, note);

                const waUniqueKey = `${todayDate}_${student.nisn}_NOTIFICATION`;

                const existingQueue = await db.whatsappQueue.where('uniqueKey').equals(waUniqueKey).first();
                if (!existingQueue && student.parentPhone) {
                    await db.whatsappQueue.add({
                        uniqueKey: waUniqueKey,
                        nisn: student.nisn,
                        studentName: student.name,
                        class: student.class,
                        parentPhone: student.parentPhone,
                        date: todayDate,
                        scanTime: currentTimeWIT,
                        status: 'QUEUED',
                        message: waMessage,
                        templateId: randomTemplate.id,
                        scheduledAt: Date.now()
                    });
                }

                setLastScannedStudent({
                    ...student,
                    scanTime: currentTimeWIT,
                    dateFormatted: `${getIndonesianDayName()}, ${getIndonesianFormattedDate(todayDate)}`,
                    status: status,
                    keterangan: note
                });

                setDuplicateAlert(null);
                loadTodayAttendance();
                onDataUpdated();
            };

            return (
                <div className="space-y-6">
                    {/* Stat Widgets */}
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                        <StatCard label="TOTAL SISWA" value={scanStats.total} icon="fa-users" color="bg-slate-900 text-white" />
                        <StatCard label="SUDAH ABSEN" value={scanStats.scanned} icon="fa-check-double" color="bg-sky-600 text-white" />
                        <StatCard label="HADIR TEPAT" value={scanStats.hadir} icon="fa-user-check" color="bg-emerald-600 text-white" />
                        <StatCard label="TERLAMBAT" value={scanStats.terlambat} icon="fa-user-clock" color="bg-amber-500 text-white" />
                        <StatCard label="BELUM ABSEN" value={scanStats.belum} icon="fa-user-times" color="bg-rose-600 text-white" />
                    </div>

                    {/* Auto-focus Hidden Scanner Form */}
                    <form onSubmit={handleScanSubmit} className="relative">
                        <input
                            ref={inputRef}
                            type="text"
                            value={scanInput}
                            onChange={(e) => setScanInput(e.target.value)}
                            placeholder="Silakan Arahkan Barcode Scanner QR Ke Sini..."
                            className="w-full py-4 px-5 bg-white border-2 border-sky-500/80 rounded-2xl font-mono text-xs shadow-glow-sm focus:outline-none focus:ring-4 focus:ring-sky-100 transition"
                            autoFocus
                        />
                        <span className="absolute right-4 top-3.5 text-xs bg-sky-100 text-sky-800 px-3 py-1.5 rounded-xl font-bold animate-pulse flex items-center">
                            <i className="fas fa-barcode mr-1.5 text-sm"></i> SCANNER AKTIF
                        </span>
                    </form>

                    {/* Alert Banner for Duplicate Rejection */}
                    {duplicateAlert && (
                        <div className={`p-5 rounded-2xl border-l-8 shadow-card-luxury flex items-start space-x-4 animate-bounce ${
                            duplicateAlert.type === 'DUPLICATE' ? 'bg-amber-50 border-amber-500 text-amber-900' : 'bg-rose-50 border-rose-500 text-rose-900'
                        }`}>
                            <div className="text-2xl mt-1">
                                <i className={`fas ${duplicateAlert.type === 'DUPLICATE' ? 'fa-exclamation-triangle text-amber-600' : 'fa-times-circle text-rose-600'}`}></i>
                            </div>
                            <div className="flex-1">
                                <h3 className="font-extrabold text-xs uppercase tracking-wider">{duplicateAlert.title}</h3>
                                {duplicateAlert.type === 'DUPLICATE' ? (
                                    <p className="text-xs mt-1 font-medium">
                                        Siswa <strong>{duplicateAlert.studentName}</strong> (Kelas {duplicateAlert.class} - NISN: {duplicateAlert.nisn}) telah absen pada jam <strong>{duplicateAlert.firstScanTime} WIT</strong>.
                                    </p>
                                ) : (
                                    <p className="text-xs mt-1 font-medium">{duplicateAlert.message}</p>
                                )}
                            </div>
                            <button onClick={() => setDuplicateAlert(null)} className="text-slate-400 hover:text-slate-700">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                    )}

                    {/* LARGE PHOTO RESULT CARD */}
                    <div className="bg-white rounded-3xl shadow-card-luxury border border-slate-200/80 overflow-hidden">
                        <div className="bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 text-white px-8 py-4 flex justify-between items-center">
                            <span className="text-xs font-black uppercase tracking-widest text-sky-400 flex items-center">
                                <i className="fas fa-id-card text-base mr-2"></i> HASIL SCAN ABSENSI SISWA TERAKHIR
                            </span>
                            <span className="text-xs font-mono text-slate-300 font-bold bg-white/10 px-3 py-1 rounded-lg">
                                BATAS HADIR: {settings?.cutoffTime || '07:20'} WIT
                            </span>
                        </div>

                        {lastScannedStudent ? (
                            <div className="p-8 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                                {/* Large Student Photo Frame */}
                                <div className="md:col-span-4 flex flex-col items-center justify-center">
                                    <div className="relative group">
                                        <div className={`absolute -inset-2 rounded-3xl blur-md opacity-40 transition ${
                                            lastScannedStudent.status === 'HADIR' ? 'bg-emerald-500' : 'bg-amber-500'
                                        }`}></div>
                                        <div className="relative w-64 h-80 bg-slate-100 rounded-3xl border-4 border-white shadow-2xl overflow-hidden flex flex-col items-center justify-center">
                                            {lastScannedStudent.photoUrl ? (
                                                <img src={lastScannedStudent.photoUrl} alt={lastScannedStudent.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="text-center p-6 text-slate-400">
                                                    <i className="fas fa-user-graduate text-8xl mb-3 text-slate-300"></i>
                                                    <p className="text-xs font-extrabold text-slate-500">FOTO PAS SISWA</p>
                                                </div>
                                            )}
                                            <div className={`absolute bottom-0 left-0 right-0 py-2.5 text-center font-black text-xs text-white uppercase tracking-wider ${
                                                lastScannedStudent.status === 'HADIR' ? 'bg-emerald-600' : 'bg-amber-600'
                                            }`}>
                                                {lastScannedStudent.status === 'HADIR' ? '✅ HADIR TEPAT WAKTU' : '⚠️ HADIR TERLAMBAT'}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Detailed Metadata Card */}
                                <div className="md:col-span-8 space-y-5">
                                    <div className="border-b border-slate-100 pb-4">
                                        <p className="text-[10px] font-black text-sky-600 uppercase tracking-widest mb-1">NAMA LENGKAP SISWA</p>
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight">{lastScannedStudent.name}</h2>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                            <p className="text-[10px] font-extrabold text-slate-400 uppercase">NOMOR INDUK (NISN)</p>
                                            <p className="text-lg font-black text-slate-800 font-mono mt-0.5">{lastScannedStudent.nisn}</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                            <p className="text-[10px] font-extrabold text-slate-400 uppercase">KELAS / ROMBEL</p>
                                            <p className="text-lg font-black text-sky-600 mt-0.5">{lastScannedStudent.class}</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                            <p className="text-[10px] font-extrabold text-slate-400 uppercase">WAKTU SCAN WIT</p>
                                            <p className="text-xl font-black text-slate-900 font-mono mt-0.5">{lastScannedStudent.scanTime} WIT</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                            <p className="text-[10px] font-extrabold text-slate-400 uppercase">HARI & TANGGAL</p>
                                            <p className="text-xs font-bold text-slate-700 mt-1">{lastScannedStudent.dateFormatted}</p>
                                        </div>
                                    </div>

                                    <div className="bg-sky-50/80 p-4 rounded-2xl border border-sky-100 flex items-start space-x-3">
                                        <i className="fas fa-info-circle text-sky-600 text-base mt-0.5"></i>
                                        <div>
                                            <p className="text-[10px] font-black text-sky-800 uppercase tracking-wider">KETERANGAN ABSENSI</p>
                                            <p className="text-xs font-semibold text-slate-700 mt-0.5">{lastScannedStudent.keterangan}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="p-20 text-center text-slate-400 space-y-4">
                                <div className="w-20 h-20 mx-auto bg-sky-50 text-sky-600 rounded-full flex items-center justify-center text-3xl shadow-inner">
                                    <i className="fas fa-qrcode animate-pulse"></i>
                                </div>
                                <h3 className="text-base font-extrabold text-slate-800">SIAP MENERIMA SCAN QR CODE</h3>
                                <p className="text-xs max-w-md mx-auto text-slate-500 font-medium">
                                    Arahkan kartu siswa ke alat barcode scanner. Informasi foto, waktu, dan status presensi siswa akan langsung ditampilkan di sini.
                                </p>
                            </div>
                        )}
                    </div>

                    {/* Today's Log Table */}
                    <div className="bg-white rounded-3xl shadow-card-luxury border border-slate-200/80 overflow-hidden">
                        <div className="p-5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider">
                                RIWAYAT SCAN ABSENSI HARI INI ({todayScans.length})
                            </h3>

                            <h2 className="text-3xl font-black text-sky-600 mt-2 font-mono">{stats.todayAttended}</h2>
                            <p className="text-xs text-slate-500 mt-2 font-medium">Siswa terverifikasi</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl shadow-card-luxury border border-slate-200/80">
                            <p className="text-[10px] font-black text-slate-400 uppercase">PERSENTASE KEHADIRAN</p>
                            <h2 className="text-3xl font-black text-emerald-600 mt-2 font-mono">{stats.percentage}%</h2>

        // --- STUDENT MANAGEMENT PAGE COMPONENT ---
        function StudentManagementPage({ students, onDataUpdated, setModalDialog }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [classFilter, setClassFilter] = useState('ALL');
            const [showModal, setShowModal] = useState(false);
            const [showBulkDeleteModal, setShowBulkDeleteModal] = useState(false);
            const [bulkConfirmText, setBulkConfirmText] = useState('');
            const [editingStudent, setEditingStudent] = useState(null);

            const [formData, setFormData] = useState({ nisn: '', name: '', class: '7A', parentPhone: '', photoUrl: '' });

            const classes = useMemo(() => {
                const unique = [...new Set(students.map(s => s.class))].sort();
                return unique.length > 0 ? unique : ['7A', '7B', '8A', '8B', '9A', '9B'];
            }, [students]);

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.nisn.includes(searchTerm);
                    const matchesClass = classFilter === 'ALL' || s.class === classFilter;
                    return matchesSearch && matchesClass;
                });
            }, [students, searchTerm, classFilter]);

            const handleOpenModal = (student = null) => {
                if (student) {
                    setEditingStudent(student);
                    setFormData({ nisn: student.nisn, name: student.name, class: student.class, parentPhone: student.parentPhone || '', photoUrl: student.photoUrl || '' });
                } else {
                    setEditingStudent(null);
                    setFormData({ nisn: '', name: '', class: classes[0] || '7A', parentPhone: '', photoUrl: '' });
                }
                setShowModal(true);
            };

            const handleSaveStudent = async (e) => {
                e.preventDefault();
                if (!formData.nisn || !formData.name || !formData.class) return;

                if (editingStudent) {
                    await db.students.update(editingStudent.id, formData);
                } else {
                    await db.students.add(formData);
                }

                setShowModal(false);
                onDataUpdated();

            const handleDeleteStudent = (id, name) => {
                setModalDialog({
                    type: 'danger',
                    title: 'HAPUS DATA SISWA',
                    message: `Apakah Anda yakin ingin menghapus data siswa ${name}?`,
                    onConfirm: async () => {
                        await db.students.delete(id);
                        onDataUpdated();

                });

            const handleBulkDelete = async () => {
                if (bulkConfirmText === 'HAPUS SEMUA DATA SISWA') {
                    await db.students.clear();
                    setShowBulkDeleteModal(false);
                    setBulkConfirmText('');
                    onDataUpdated();
                }

            const handleDownloadTemplate = () => {
                const templateData = [
                    { 'No': 1, 'Nama Siswa': 'Maria Alfonsina', 'NISN': '0058123456', 'Nomor HP Orang Tua': '081248001122', 'Kelas': '8B' },
                    { 'No': 2, 'Nama Siswa': 'Yohanes Wenda', 'NISN': '0058123457', 'Nomor HP Orang Tua': '081248001123', 'Kelas': '8B' }
                ];
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
                XLSX.writeFile(wb, "Template_Import_Siswa_SMPN6.xlsx");
            };

            const handleImportExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsName = wb.SheetNames[0];
                    const ws = wb.Sheets[wsName];
                    const data = XLSX.utils.sheet_to_json(ws);

                    const newStudents = [];
                    for (let row of data) {
                        const nisn = String(row['NISN'] || '').trim();
                        const name = String(row['Nama Siswa'] || '').trim();
                        const sClass = String(row['Kelas'] || '').trim();
                        const phone = String(row['Nomor HP Orang Tua'] || '').trim();

                        if (nisn && name && sClass) {
                            newStudents.push({ nisn, name, class: sClass, parentPhone: phone, photoUrl: '' });
                        }
                    }

                    if (newStudents.length > 0) {
                        await db.students.bulkPut(newStudents);
                        onDataUpdated();
                        setModalDialog({
                            type: 'success',
                            title: 'IMPORT BERHASIL',
                            message: `Berhasil mengimpor ${newStudents.length} data siswa baru ke database!`
                        });
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleMassPhotoUpload = (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                let updatedCount = 0;
                Array.from(files).forEach(file => {
                    const fileName = file.name;
                    const nisn = fileName.substring(0, fileName.lastIndexOf('.'));

                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const base64Photo = evt.target.result;
                        const student = await db.students.where('nisn').equals(nisn).first();
                        if (student) {
                            await db.students.update(student.id, { photoUrl: base64Photo });
                            updatedCount++;
                            onDataUpdated();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            };

            return (
                <div className="space-y-6">
                    {/* Action Bar */}
                    <div className="bg-white p-5 rounded-3xl shadow-card-luxury border border-slate-200/80 flex flex-wrap gap-4 justify-between items-center">

                            />
                            <select 
                                value={classFilter}
                                onChange={(e) => setClassFilter(e.target.value)}
                                className="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:outline-none"
                            >
                                <option value="ALL">SEMUA KELAS</option>
                                {classes.map(c => <option key={c} value={c}>KELAS {c}</option>)}
                            </select>
                        </div>

                        <div className="flex flex-wrap gap-2">
                            <button onClick={handleDownloadTemplate} className="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200">
                                <i className="fas fa-download mr-1.5"></i> Template Excel
                            </button>
                            <label className="px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl cursor-pointer shadow-md shadow-emerald-200">
                                <i className="fas fa-file-excel mr-1.5"></i> Import Excel
                                <input type="file" accept=".xlsx, .xls" onChange={handleImportExcel} className="hidden" />
                            </label>
                            <label className="px-3.5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl cursor-pointer shadow-md shadow-indigo-200">
                                <i className="fas fa-images mr-1.5"></i> Upload Foto Massal
                                <input type="file" multiple accept="image/*" onChange={handleMassPhotoUpload} className="hidden" />
                            </label>
                            <button onClick={() => handleOpenModal()} className="px-3.5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-xl shadow-md shadow-sky-200">
                                <i className="fas fa-plus mr-1.5"></i> Tambah Siswa
                            </button>
                            <button onClick={() => setShowBulkDeleteModal(true)} className="px-3.5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-md shadow-rose-200">
                                <i className="fas fa-trash-alt mr-1.5"></i> Hapus Semua
                            </button>
                        </div>
                    </div>

                    {/* Student Data Table */}
                    <div className="bg-white rounded-3xl shadow-card-luxury border border-slate-200/80 overflow-hidden">
                        <table className="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr className="bg-slate-900 text-white uppercase font-black text-[10px] tracking-wider">

                                    <th className="p-4">NISN</th>
                                    <th className="p-4">NAMA LENGKAP SISWA</th>
                                    <th className="p-4">KELAS</th>
                                    <th className="p-4">NO. HP ORANG TUA</th>
                                    <th className="p-4 pr-6 text-right">AKSI</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredStudents.length > 0 ? (
                                    filteredStudents.map((s) => (
                                        <tr key={s.id} className="hover:bg-slate-50/80 transition">
                                            <td className="p-3.5 pl-6">
                                                <div className="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center shadow-sm">
                                                    {s.photoUrl ? (
                                                        <img src={s.photoUrl} alt={s.name} className="w-full h-full object-cover" />

                                                        <i className="fas fa-user text-slate-400 text-sm"></i>

                                            <td className="p-3.5 font-mono font-bold text-slate-700">{s.nisn}</td>
                                            <td className="p-3.5 font-bold text-slate-900">{s.name}</td>
                                            <td className="p-3.5 font-bold text-sky-600">{s.class}</td>
                                            <td className="p-3.5 font-mono text-slate-600">{s.parentPhone || '-'}</td>
                                            <td className="p-3.5 pr-6 text-right space-x-2">
                                                <button onClick={() => handleOpenModal(s)} className="p-2 bg-amber-50 text-amber-700 hover:bg-amber-100 rounded-xl font-bold border border-amber-200">
                                                    <i className="fas fa-edit"></i>

                                                    <i className="fas fa-trash"></i>

                                        <td colSpan="6" className="p-8 text-center text-slate-400 font-medium">Tidak ada data siswa ditemukan.</td>
                                    </tr>
                                )}
                            </tbody>
                        </table>

                    {/* Modal Add / Edit Student */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-card-luxury max-w-md w-full overflow-hidden border border-slate-100">

        // --- REKAP HARIAN PAGE COMPONENT WITH EXCEL REKAP DOWNLOAD ---
        function RekapHarianPage({ students }) {
            const [selectedDate, setSelectedDate] = useState(getFormattedDate());
            const [selectedClass, setSelectedClass] = useState('ALL');
            const [records, setRecords] = useState([]);

            useEffect(() => {
                loadDailyRecords();
            }, [selectedDate]);

            const loadDailyRecords = async () => {
                const data = await db.attendance.where('date').equals(selectedDate).toArray();
                setRecords(data);
            };

            const classes = useMemo(() => {
                const unique = [...new Set(students.map(s => s.class))].sort();
                return unique.length > 0 ? unique : ['7A', '7B', '8A', '8B', '9A', '9B'];
            }, [students]);

            const displayData = useMemo(() => {
                return students.filter(s => selectedClass === 'ALL' || s.class === selectedClass).map(s => {
                    const att = records.find(r => r.nisn === s.nisn);
                    return {

        function SettingsPage({ settings, onDataUpdated, setModalDialog }) {
            const [cutoff, setCutoff] = useState(settings?.cutoffTime || '07:20');
            const [apiKey, setApiKey] = useState(settings?.whatsappApiKey || 'JS3EZBCY67FH36ygwLgE');

            const handleSaveSettings = async (e) => {
                e.preventDefault();
                await db.settings.put({
                    ...settings,
                    id: 'app_config',
                    cutoffTime: cutoff,
                    whatsappApiKey: apiKey
                });
                onDataUpdated();
                setModalDialog({
                    type: 'success',
                    title: 'PENGATURAN DISIMPAN',
                    message: 'Pengaturan jam batas absensi dan API Key telah berhasil diperbarui.'
                });
            };

            const handleResetDatabase = () => {
                setModalDialog({
                    type: 'danger',
                    title: 'RESET DATABASE ABSENSI',
                    message: 'Tindakan ini akan menghapus SELURUH riwayat scan absensi dan antrean WhatsApp. Data siswa tidak akan terhapus.',
                    onConfirm: async () => {
                        await db.attendance.clear();
                        await db.whatsappQueue.clear();
                        await db.whatsappLogs.clear();
                        onDataUpdated();
                    }
                });
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-white p-8 rounded-3xl shadow-card-luxury border border-slate-200/80 space-y-6">
                        <h3 className="font-extrabold text-slate-900 text-sm uppercase tracking-wider border-b pb-4">
                            PENGATURAN KONFIGURASI APLIKASI
                        </h3>

                        <form onSubmit={handleSaveSettings} className="space-y-4">
                            <div>
                                <label className="block text-xs font-black text-slate-700 uppercase mb-2">Batas Jam Masuk (Hadir Tepat Waktu WIT)</label>
                                <input 
                                    type="time" 
                                    value={cutoff} 
                                    onChange={(e) => setCutoff(e.target.value)} 
                                    className="px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold w-full" 
                                    required 
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-black text-slate-700 uppercase mb-2">API Key WhatsApp Messaging</label>
                                <input 
                                    type="text" 
                                    value={apiKey} 
                                    onChange={(e) => setApiKey(e.target.value)} 
                                    className="px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold w-full" 
                                    required 
                                />
                                <p className="text-[11px] text-slate-400 mt-1 font-medium">Default API Key: JS3EZBCY67FH36ygwLgE</p>
                            </div>

                            <button type="submit" className="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-extrabold rounded-xl shadow-md text-xs uppercase">
                                Simpan Perubahan Pengaturan
                            </button>
                        </form>
                    </div>

                    <div className="bg-rose-50/60 p-6 rounded-3xl border border-rose-200/80 space-y-3">
                        <h4 className="font-extrabold text-rose-800 text-xs uppercase tracking-wider">ZONE PEMELIHARAAN SYSTEM</h4>
                        <p className="text-xs text-rose-700 font-medium">Reset riwayat transaksi presensi dan queue pesan jika diperlukan untuk semester baru.</p>
                        <button onClick={handleResetDatabase} className="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow-md">
                            Reset Riwayat Absensi & Queue WA
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
