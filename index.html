            Upload: () => <svg className="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
        };

        // --- UTILS: TIME (WIT - Asia/Jayapura) ---
        const getNowWIT = () => {
            const now = new Date();
            // Force timezone to Asia/Jayapura
            const formatterDate = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jayapura', year: 'numeric', month: '2-digit', day: '2-digit' });
            const formatterTime = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jayapura', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            
            const dateParts = formatterDate.formatToParts(now);
            const timeParts = formatterTime.formatToParts(now);
            
            const year = dateParts.find(p => p.type === 'year').value;
            const month = dateParts.find(p => p.type === 'month').value;
            const day = dateParts.find(p => p.type === 'day').value;
            const hour = timeParts.find(p => p.type === 'hour').value;
            const minute = timeParts.find(p => p.type === 'minute').value;
            const second = timeParts.find(p => p.type === 'second').value;

            const dateStr = `${year}-${month}-${day}`;
            const timeStr = `${hour}:${minute}:${second}`;
            const displayDate = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jayapura', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(now);

            return { dateStr, timeStr, displayDate, timestamp: now.getTime() };
        };

        const checkAttendanceStatus = (timeStr) => {
            // Batas Hadir: 07.20 WIT
            return timeStr <= "07:20:59" ? "HADIR" : "TERLAMBAT";
        };

        const generateId = (date, nisn) => `${date}_${nisn}`;

        // --- MOCK WHATSAPP TEMPLATES ---
        const waTemplates = [
            "Yth. Bapak/Ibu, Ananda {nama} kelas {kelas} telah absensi di SMPN 6 Manokwari pada {tanggal} pukul {jam} WIT. Ket: {status}. Terima kasih.",
            "Informasi Absensi: Ananda {nama} ({kelas}) tercatat {status} pada {tanggal} pukul {jam} WIT. Salam dari SMPN 6 Manokwari.",
            "Kepada Yth. Wali Murid, memberitahukan bahwa {nama} kelas {kelas} hadir di sekolah pukul {jam} WIT tgl {tanggal}. Status: {status}.",
            "Pemberitahuan dari SMPN 6 Manokwari: {nama} kelas {kelas} telah memindai QR Code kehadiran pada {tanggal} jam {jam} WIT. Keterangan: {status}.",
            "Yth. Bapak/Ibu Orang Tua/Wali, kami informasikan bahwa Ananda {nama}, kelas {kelas}, telah melakukan absensi di SMP Negeri 6 Manokwari pada {tanggal} pukul {jam} WIT dengan keterangan {status}."
        ];

        // Di aplikasi nyata ini di Cloud Functions. Di sini kita gunakan custom hook di root app.
        const useWhatsAppQueueProcessor = () => {
            const [queueStats, setQueueStats] = useState({ waiting: 0, sent: 0, failed: 0, isPaused: false, nextBatchIn: 0, batchCount: 0 });

            useEffect(() => {
                let intervalId;
                let countdownId;

                const processQueue = async () => {
                    if (queueStats.isPaused) return;

                    try {
                        const q = query(collection(db, "whatsappQueue"), where("status", "==", "QUEUED"), orderBy("createdAt", "asc"), limit(5));
                        const snapshot = await getDocs(q);

                        if (snapshot.empty) {
                            // Update stats real-time
                            updateStatsDisplay();
                            return;
                        }

                        const batch = writeBatch(db);
                        snapshot.forEach((docSnap) => {
                            // Simulasi API Call
                            const isSuccess = Math.random() > 0.05; // 95% success rate
                            const ref = doc(db, "whatsappQueue", docSnap.id);
                            if (isSuccess) {
                                batch.update(ref, { status: "SENT", sentAt: serverTimestamp() });
                            } else {
                                const currentAttempts = docSnap.data().attempts || 0;
                                if (currentAttempts >= 4) {
                                    batch.update(ref, { status: "FAILED_FINAL", errorMessage: "Max retries reached" });
                                } else {
                                    batch.update(ref, { status: "FAILED", attempts: currentAttempts + 1 });
                                }
                            }
                        });

                        await batch.commit();
                        
                        // Setelah batch selesai, pause 5 menit (Untuk demo/preview ini diset 10 detik agar terlihat, tapi untuk prod ubah ke 300)
                        const pauseSeconds = 300; // 5 Menit
                        setQueueStats(prev => ({ ...prev, isPaused: true, nextBatchIn: pauseSeconds, batchCount: prev.batchCount + 1 }));

                    } catch (error) {
                        console.error("Queue Processing Error:", error);
                    }
                };

                const updateStatsDisplay = async () => {
                    const statsRef = doc(db, "system", "wa_stats");
                    // Dalam implementasi single file tanpa aggregasi cloud function, kita hitung kasar dari snapshot, 
                    // namun karena ini 800 data/hari, query count sangat optimal. 
                    // Disini kita biarkan frontend listener kecil untuk dashboard saja.
                };

                intervalId = setInterval(processQueue, 3000); // Check every 3 seconds if not paused

                return () => { clearInterval(intervalId); clearInterval(countdownId); };
            }, [queueStats.isPaused]);

            // Countdown Timer effect
            useEffect(() => {
                let id;
                if (queueStats.isPaused && queueStats.nextBatchIn > 0) {
                    id = setInterval(() => {
                        setQueueStats(prev => {
                            if (prev.nextBatchIn <= 1) {
                                clearInterval(id);
                                return { ...prev, isPaused: false, nextBatchIn: 0 };
                            }
                            return { ...prev, nextBatchIn: prev.nextBatchIn - 1 };
                        });
                    }, 1000);
                }
                return () => clearInterval(id);
            }, [queueStats.isPaused, queueStats.nextBatchIn]);

            return queueStats;
        };


        
        const MessageModal = ({ isOpen, title, message, type = "error", onClose }) => {

                            <button 
                                onClick={handleLogin} 
                                disabled={loading}
                                className="w-full flex justify-center items-center gap-3 py-3 px-4 border border-slate-300 rounded-xl shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-school-500 transition-all active:scale-95 disabled:opacity-70"
                            >
                                {loading ? <Icons.Loader /> : (
                                    <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                                )}
                                Masuk dengan Google
                            </button>

                            {errorMsg && (
                                <div className="mt-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-100 flex items-start gap-2 text-left">
                                    <Icons.XCircle />
                                    <span className="leading-snug">{errorMsg}</span>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        };


        const ScannerPage = () => {
            const [lastScan, setLastScan] = useState(null);
            const [recentScans, setRecentScans] = useState([]);
            const [status, setStatus] = useState({ type: 'idle', message: 'SIAP MELAKUKAN SCAN', sub: 'Silakan arahkan QR Code siswa ke scanner.' });
            
            // Ref untuk menjaga buffer ketikan dari scanner
            const bufferRef = useRef('');
            const isProcessingRef = useRef(false);

            // Fetch initial recent scans for today
            useEffect(() => {
                const { dateStr } = getNowWIT();
                const q = query(collection(db, "attendance"), where("date", "==", dateStr), orderBy("timestamp", "desc"), limit(5));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const scans = [];
                    snapshot.forEach(doc => scans.push({ id: doc.id, ...doc.data() }));
                    setRecentScans(scans);
                });
                return () => unsubscribe();
            }, []);

            const processScan = async (nisnInput) => {
                if (isProcessingRef.current) return;
                isProcessingRef.current = true;
                const nisn = nisnInput.trim();
                const { dateStr, timeStr, displayDate, timestamp } = getNowWIT();
                const attendanceId = generateId(dateStr, nisn);

                try {
                    // 1. Cek Duplikasi Cepat (Memory & DB)
                    if (recentScans.some(s => s.nisn === nisn)) {
                        throw new Error("DUPLICATE");
                    }
                    const attDocRef = doc(db, "attendance", attendanceId);
                    const attDocSnap = await getDoc(attDocRef);
                    if (attDocSnap.exists()) {
                        throw new Error("DUPLICATE");
                    }

                    // 2. Lookup Data Siswa
                    const studentRef = collection(db, "students");
                    const q = query(studentRef, where("nisn", "==", nisn), limit(1));
                    const studentSnap = await getDocs(q);
                    
                    if (studentSnap.empty) {
                        throw new Error("NOT_FOUND");
                    }

                    const studentData = studentSnap.docs[0].data();
                    const attStatus = checkAttendanceStatus(timeStr);

                    const attendanceData = {
                        nisn: studentData.nisn,
                        studentName: studentData.name,
                        class: studentData.class,
                        photoUrl: studentData.photoUrl || '',
                        date: dateStr,
                        time: timeStr,
                        status: attStatus,
                        timestamp: timestamp, // using client timestamp for speed, rules can enforce
                    };

                    // 3. Simpan ke Firestore (Atomic jika memungkinkan, di sini pakai setDoc)
                    await setDoc(attDocRef, attendanceData);

                    // 4. Masukkan ke WhatsApp Queue (Background)
                    if (studentData.parentPhone) {
                        const template = waTemplates[Math.floor(Math.random() * waTemplates.length)];
                        let msg = template
                            .replace("{nama}", studentData.name)
                            .replace("{kelas}", studentData.class)
                            .replace("{tanggal}", displayDate)
                            .replace("{jam}", timeStr)
                            .replace("{status}", attStatus);
                        
                        await setDoc(doc(collection(db, "whatsappQueue")), {
                            attendanceId,
                            nisn: studentData.nisn,
                            studentName: studentData.name,
                            parentPhone: studentData.parentPhone,
                            message: msg,
                            status: "QUEUED",
                            attempts: 0,
                            createdAt: serverTimestamp()
                        });
                    }

                    // 5. Update UI Langsung (Siswa Terakhir)
                    setLastScan({
                        ...attendanceData,
                        displayDate
                    });
                    setStatus({ type: 'success', message: 'SCAN BERHASIL ✅', sub: '' });

                    // Kembali ke status siap setelah 5 detik (tapi data terakhir tetap tampil)
                    setTimeout(() => {
                        setStatus({ type: 'idle', message: 'SIAP MELAKUKAN SCAN', sub: 'Silakan arahkan QR Code siswa ke scanner.' });
                    }, 5000);

                } catch (error) {
                    let msg = "Terjadi kesalahan sistem.";
                    if (error.message === "DUPLICATE") msg = "Absensi siswa sudah tercatat hari ini.";
                    if (error.message === "NOT_FOUND") msg = `Data siswa dengan NISN ${nisn} belum terdaftar.`;
                    
                    setStatus({ type: 'error', message: 'SCAN GAGAL ❌', sub: msg });
                    setTimeout(() => {
                        setStatus({ type: 'idle', message: 'SIAP MELAKUKAN SCAN', sub: 'Silakan arahkan QR Code siswa ke scanner.' });
                    }, 4000);
                } finally {
                    isProcessingRef.current = false;
                }
            };

            // Global Keydown Listener untuk Scanner
            useEffect(() => {
                const handleKeyDown = (e) => {
                    // Abaikan jika mengetik di input text/textarea lain
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                    if (e.key === 'Enter') {
                        if (bufferRef.current.length > 3) {
                            processScan(bufferRef.current);
                        }
                        bufferRef.current = ''; // Reset buffer
                    } else if (e.key.length === 1) { // Hanya tangkap karakter alphanumeric
                        bufferRef.current += e.key;
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);

                reader.onload = async (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const data = XLSX.utils.sheet_to_json(ws);
                    
                    let successCount = 0;
                    let failCount = 0;
                    const batch = writeBatch(db);
                    
                    // Simple validation
                    for(let row of data) {
                        if (row.NISN && row['Nama Siswa'] && row.Kelas) {
                            const nisnStr = row.NISN.toString().trim();
                            const docRef = doc(db, "students", nisnStr); // Use NISN as document ID for easy lookup
                            batch.set(docRef, {
                                nisn: nisnStr,
                                name: row['Nama Siswa'].toString().trim(),
                                class: row.Kelas.toString().trim().toUpperCase(),
                                parentPhone: row['Nomor HP Orang Tua'] ? row['Nomor HP Orang Tua'].toString().trim() : "",

                                updatedAt: serverTimestamp()

                            successCount++;

                        setModalInfo({ isOpen: true, title: "Import Gagal", message: "Pastikan format kolom sesuai template.", type: 'error' });

        };


        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('scan');
            const queueStats = useWhatsAppQueueProcessor(); // Start background process

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser && currentUser.email === ALLOWED_EMAIL) {
                        setUser(currentUser);
                    } else {
                        setUser(null);
                        if (currentUser) signOut(auth); // Sign out if wrong email cached
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (authLoading) {
                return <div className="min-h-screen flex items-center justify-center bg-slate-50"><Icons.Loader /></div>;
            }

            if (!user) {
                return <Login />;
            }

            const menuItems = [
                { id: 'scan', label: 'Scan Hari Ini', icon: Icons.Scan },
                { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
                { id: 'students', label: 'Data Siswa', icon: Icons.Users },
                { id: 'recap', label: 'Rekapan Absensi', icon: Icons.FileText },
            ];

            return (
                <div className="min-h-screen bg-slate-100 flex overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className="w-72 bg-white shadow-xl z-20 flex flex-col hidden md:flex">
                        <div className="p-6 border-b border-slate-100 flex flex-col items-center text-center">
                            <img src="https://i.ibb.co.com/JWy6dhzM/LOGO-SMP6-1-removebg-preview.png" alt="Logo" className="h-16 w-auto mb-3" />
                            <h1 className="font-bold text-slate-900 tracking-tight leading-tight">ABSENSI SISWA</h1>
                            <p className="text-xs text-school-600 font-medium">SMPN 6 MANOKWARI</p>
                        </div>
                        <div className="flex-1 overflow-y-auto py-6 px-4 space-y-1">
                            {menuItems.map(item => {
                                const Icon = item.icon;
                                const isActive = activeTab === item.id;
                                return (
                                    <button 
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all ${
                                            isActive 
                                            ? 'bg-school-50 text-school-700 shadow-sm border border-school-100' 
                                            : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'
                                        }`}
                                    >
                                        <Icon />
                                        {item.label}
                                    </button>
                                );
                            })}
                        </div>
                        <div className="p-4 border-t border-slate-100 bg-slate-50">
                            <div className="flex items-center gap-3 mb-4 px-2">
                                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                <div className="text-xs">
                                    <p className="text-slate-400">Login sebagai Proktor</p>
                                    <p className="font-medium text-slate-700 truncate w-40" title={user.email}>{user.email}</p>
                                </div>
                            </div>
                            <button onClick={() => signOut(auth)} className="w-full flex justify-center items-center gap-2 py-2.5 px-4 bg-white border border-slate-200 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition">
                                <Icons.LogOut /> Logout
                            </button>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        {/* Mobile Header */}
                        <header className="md:hidden bg-white shadow-sm p-4 flex justify-between items-center z-10">
                            <div className="flex items-center gap-2">
                                <img src="https://i.ibb.co.com/JWy6dhzM/LOGO-SMP6-1-removebg-preview.png" alt="Logo" className="h-8" />
                                <h1 className="font-bold text-slate-800 text-sm">SMPN 6 MANOKWARI</h1>
                            </div>
                            <select 
                                value={activeTab} 
                                onChange={(e) => setActiveTab(e.target.value)}
                                className="bg-slate-50 border border-slate-200 rounded-lg text-sm px-2 py-1 font-medium"
                            >
                                {menuItems.map(item => <option key={item.id} value={item.id}>{item.label}</option>)}
                            </select>
                        </header>

                        <div className="flex-1 overflow-auto p-4 md:p-8 custom-scrollbar relative">
                            {/* Render Content Based on Tab */}
                            {activeTab === 'scan' && <ScannerPage />}
                            {activeTab === 'dashboard' && <DashboardPage queueStats={queueStats} />}
                            {activeTab === 'students' && <StudentsPage />}
                            {activeTab === 'recap' && <RecapPage />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
